dbms:[
{q:'What is the difference between DELETE, TRUNCATE, and DROP?',
a:'DELETE = DML. Removes rows one by one. Can use WHERE. Can be rolled back. Triggers fire. Logged. TRUNCATE = DDL. Removes all rows in bulk. No WHERE. Faster. Usually cannot roll back. No triggers. DROP = removes entire table structure and data permanently.',
fu:'Which is fastest for clearing a large table?',
trap:'TRUNCATE cannot be rolled back in most databases. DELETE can. A common exam distinction.'},
{q:'What is the difference between UNION and UNION ALL?',
a:'UNION deduplicates (runs sort/hash to remove duplicates) — slower. UNION ALL keeps all rows including duplicates — significantly faster. Use UNION ALL unless deduplication is required.',
fu:'Can UNION combine tables with different column types?',
trap:'Default to UNION ALL for performance. Only use UNION when you need deduplication.'},
{q:'Explain window functions and the OVER clause.',
a:'Window functions compute across rows related to the current row without collapsing them. OVER() defines the window. PARTITION BY divides into groups (like GROUP BY but no collapse). ORDER BY within OVER defines order for ranking/running total.',
fu:'What is the difference between RANK(), DENSE_RANK(), ROW_NUMBER()?',
trap:'Window functions do NOT filter rows. To filter on window function results, wrap in a subquery or CTE.'},
{q:'What is a self-join and when do you use it?',
a:'A table joined to itself. Used for hierarchical or recursive data. Example: employee-manager relation where both are in the same table. Must use aliases: SELECT e.name, m.name FROM emp e JOIN emp m ON e.manager_id=m.id.',
fu:'What is a recursive CTE?',
trap:'Requires table aliases — both instances of the table need distinct names.'},
{q:'What is optimistic vs pessimistic locking?',
a:'Pessimistic: lock on read (SELECT...FOR UPDATE), blocks others — safe, lower concurrency. Optimistic: read without lock, check version on write, fail if changed — higher concurrency, requires retry on conflict. Use optimistic for read-heavy; pessimistic for contention-heavy write scenarios.',
fu:'When would pessimistic locking cause deadlocks?',
trap:'Optimistic locking can cause retry storms under heavy write contention.'},
{q:'What is a view? Does it store data?',
a:'A view is a named saved SELECT query — a virtual table. By default, it does NOT store data (re-executes the SELECT on each access). Materialized views DO store data (pre-computed snapshot). Views simplify complex queries and provide access control.',
fu:'What is the performance implication of querying a view that joins 5 tables?',
trap:'Regular views re-execute on every query. If the underlying query is expensive, the view is expensive.'},
{q:'What causes a deadlock in a database and how is it resolved?',
a:'Transaction A holds lock on Row 1, waits for Row 2. Transaction B holds lock on Row 2, waits for Row 1. Circular wait. DB detects via wait-for graph. Resolution: abort the younger transaction. Application must detect and retry.',
fu:'How do you avoid database deadlocks in application code?',
trap:'Always access rows/tables in the same order across transactions to prevent circular waits.'},
{q:'Explain functional dependency and what it means for normalization.',
a:'X→Y means knowing X always determines Y. emp_id→name is a FD. dept_id→dept_name is a FD. If emp_id→dept_id→dept_name (transitive), this violates 3NF because dept_name depends on a non-key attribute.',
fu:'What is a partial dependency and which normal form addresses it?',
trap:'FDs are directional: X→Y does not imply Y→X.'}
],
os:[
{q:'What is the difference between preemptive and non-preemptive scheduling?',
a:'Preemptive: OS can forcibly remove CPU from a running process (timer interrupt). Enables fair sharing. Examples: Round Robin, Preemptive Priority. Non-preemptive: process runs until it voluntarily yields or terminates. Examples: FCFS, non-preemptive SJF. Modern OS use preemptive.',
fu:'What happens during a timer interrupt?',
trap:'FCFS is non-preemptive — a long process holds CPU until done, causing convoy effect.'},
{q:'What is the critical section problem? What are the 3 requirements for a solution?',
a:'A code region accessing shared resources that must execute atomically. 3 requirements: 1. Mutual Exclusion — only one process in critical section. 2. Progress — system makes progress (no indefinite delay). 3. Bounded Waiting — every waiting process eventually enters (no starvation).',
fu:'How does Peterson\'s algorithm solve this without hardware support?',
trap:'Simply setting a flag is not sufficient — it is not atomic.'},
{q:'What is a zombie process vs an orphan process?',
a:'Zombie: finished execution but entry remains in process table because parent hasn\'t called wait(). "Dead but not reaped." Orphan: process whose parent died. Adopted by init (PID 1) which calls wait(). Both are different states.',
fu:'How do you prevent zombie processes?',
trap:'Zombie ≠ orphan. Zombie = finished, unreaped. Orphan = parent is gone.'},
{q:'Explain Banker\'s Algorithm.',
a:'Deadlock AVOIDANCE algorithm. Before granting a resource request, the system simulates the allocation and checks if the result is a "safe state" — whether all processes can eventually complete given remaining resources. Only grants if safe.',
fu:'What is a safe state?',
trap:'Banker\'s is theoretical — too expensive for real OS. Practical systems use detection + recovery (abort and retry).'},
{q:'What is thrashing? How is it detected and prevented?',
a:'Thrashing: process spends more time handling page faults and swapping than executing. Caused by too many processes competing for too little RAM. Detected: CPU utilization drops sharply while disk I/O spikes. Prevention: working set model, reducing multiprogramming degree.',
fu:'What is the working set model?',
trap:'Adding more processes under thrashing worsens it — counter-intuitive. Reduce the process count.'},
{q:'What is the difference between multiprogramming and multitasking and multiprocessing?',
a:'Multiprogramming: multiple programs in memory; when one waits for I/O, another runs (keeps CPU busy). Multitasking: preemptive time-sharing giving illusion of parallelism on one CPU. Multiprocessing: multiple CPUs executing truly simultaneously.',
fu:'What is multithreading vs multiprocessing?',
trap:'Multiprogramming ≠ parallelism. It\'s about CPU utilization, not simultaneous execution.'}
],

{q:'Walk through what happens when you type www.google.com and press Enter.',
a:'1. Browser cache DNS check. 2. OS cache. 3. ISP recursive resolver → root NS → .com TLD NS → google NS → IP. 4. OS checks ARP cache for gateway MAC. 5. TCP 3-way handshake. 6. TLS handshake (HTTPS). 7. HTTP GET request. 8. Server responds. 9. Browser renders.',
fu:'Where does NAT fit in this flow?',
trap:'Missing ARP step (needed to find MAC of default gateway) is a common omission.'},
{q:'What is NAT and why does it complicate peer-to-peer?',
a:'NAT = Network Address Translation. Maps (private IP, port) → (public IP, different port). Many devices share one public IP. P2P problem: device behind NAT is not directly reachable from the internet. Requires hole punching, STUN servers, or port forwarding.',
fu:'What is the difference between SNAT and DNAT?',
trap:'NAT breaks end-to-end connectivity — a design assumption of the original internet.'},
{q:'What is CORS and who enforces it?',
a:'Cross-Origin Resource Sharing. Browser security policy restricting web pages from making requests to different origins (scheme+host+port). Server declares allowed origins via Access-Control-Allow-Origin header. Preflight OPTIONS request for non-simple requests.',
fu:'What is a CORS preflight request?',
trap:'CORS is enforced by the BROWSER, not the server. Backend-to-backend API calls are NOT subject to CORS.'},
{q:'What is the difference between HTTP/1.1, HTTP/2, and HTTP/3?',
a:'HTTP/1.1: one request per TCP connection at a time (head-of-line blocking). Keep-alive reuses connection but not truly multiplexed. HTTP/2: multiplexing (multiple requests over one TCP), binary protocol, header compression (HPACK), server push. HTTP/3: runs over QUIC (UDP), eliminates TCP head-of-line blocking.',
fu:'What problem does HTTP/2 multiplexing solve?',
trap:'HTTP/1.1 keep-alive reuses connection but still has head-of-line blocking per connection.'},
{q:'What is a socket?',
a:'An endpoint for network communication identified by (IP address + port). A socket pair uniquely identifies a TCP connection: (src IP, src port, dst IP, dst port). OS represents sockets as file descriptors. Server socket: bind+listen+accept. Client: connect.',
fu:'What port does HTTPS use by default?',
trap:'Port is a Transport Layer concept (L4). Well-known ports: HTTP=80, HTTPS=443, SSH=22, DNS=53, FTP=21.'},
{q:'Explain the TLS handshake briefly.',
a:'ClientHello (cipher suites, TLS version) → ServerHello + Certificate → Client verifies cert against CA → Key exchange (ECDHE: client+server generate shared secret) → Both derive symmetric session key → Handshake complete. Symmetric AES used for bulk data.',
fu:'Why is asymmetric crypto not used for bulk data?',
trap:'Asymmetric crypto (RSA/ECDHE) used only for key exchange. AES symmetric for data — 1000x faster.'}
],

{q:'What is the difference between BFS and DFS? When to use each?',
a:'BFS: level-by-level using a queue. Guarantees shortest path in UNWEIGHTED graphs. Good for: shortest path, minimum depth, level-order. DFS: depth-first using stack/recursion. Good for: path existence, cycle detection, topological sort, connected components.',
fu:'How does BFS find shortest path but DFS does not?',
trap:'BFS shortest path only in UNWEIGHTED graphs. Weighted: use Dijkstra\'s algorithm.'},
{q:'What is dynamic programming and when do you use it vs greedy?',
a:'DP: break into overlapping subproblems, cache results (memoization=top-down, tabulation=bottom-up). Use when problem has optimal substructure and overlapping subproblems. Greedy: make locally optimal choice at each step. Use when greedy choice leads to globally optimal (provable).',
fu:'Give an example where greedy fails but DP works.',
trap:'Greedy does not always work. Coin change with arbitrary denominations: greedy fails for denominations like {1,3,4} targeting 6. DP gives optimal.'},
{q:'What is amortized complexity? Give an example.',
a:'Average cost per operation over a sequence of operations — not worst-case for a single one. Example: ArrayList.add() is O(1) amortized. Occasionally triggers O(n) resize (doubling capacity), but cost spread over n operations = O(1) average per add.',
fu:'What is the amortized complexity of stack push/pop with a two-stack queue?',
trap:'"Amortized O(1)" ≠ every operation is O(1). Individual ops can be expensive.'},
{q:'How do you detect a cycle in a directed graph?',
a:'DFS with 3 states: WHITE (unvisited), GRAY (in current DFS path), BLACK (fully visited). If DFS visits a GRAY node → back edge → cycle exists. For undirected graph: track parent, or use Union-Find.',
fu:'How does Union-Find detect a cycle in an undirected graph?',
trap:'Undirected and directed cycle detection are different algorithms. Don\'t confuse them.'},
{q:'When to use a heap vs sorting?',
a:'Heap: when you need repeated min/max access as data arrives. O(log n) insert/extract. Good for streaming data, Top-K, priority queues. Sorting: when you need all elements ordered once, then query multiple times. O(n log n) then O(1) access. Use heap for k<<n.',
fu:'What is the time complexity of building a heap from n elements?',
trap:'Building a heap from scratch (heapify) is O(n), not O(n log n). Individual insertions would be O(n log n).'},
{q:'What is the difference between memoization and tabulation?',
a:'Memoization = top-down DP. Recursive with a cache (HashMap or array). Only computes needed subproblems. Risk of stack overflow for deep recursion. Tabulation = bottom-up DP. Iterative, fills table in dependency order. Usually more space-efficient, no recursion overhead.',
fu:'When is memoization preferred over tabulation?',
trap:'Memoization only computes subproblems actually needed. Tabulation always computes all — but is often more cache-friendly.'}
]

/* ─── MCQ QUESTIONS ─────────────────────────────────────── */
const MCQ=[
// JAVA
{id:'j1',topic:'Java',diff:'Easy',q:'What does the JVM do?',opts:['Compiles Java source code to bytecode','Executes bytecode by translating to native instructions','Stores Java class files on disk','Manages database connections'],correct:1,exp:'JVM (Java Virtual Machine) executes bytecode. It loads, verifies, and JIT-compiles bytecode to native instructions. javac (not JVM) compiles source to bytecode.'},
{id:'j2',topic:'Java',diff:'Easy',q:'String a="hello"; String b=new String("hello"); System.out.println(a==b);',opts:['true','false','Compilation error','NullPointerException'],correct:1,exp:'== compares references. "hello" is in the string pool. new String("hello") creates a new heap object. Different references → false.'},
{id:'j3',topic:'Java',diff:'Medium',q:'Which is NOT a necessary condition for deadlock?',opts:['Mutual Exclusion','Hold and Wait','Circular Wait','Preemption allowed'],correct:3,exp:'Deadlock requires: 1.Mutual Exclusion 2.Hold&Wait 3.No Preemption 4.Circular Wait. "Preemption allowed" breaks condition 3, so deadlock cannot occur.'},
{id:'j4',topic:'Java',diff:'Medium',q:'What is the output? int x=5/2; System.out.println(x);',opts:['2.5','2','3','Compilation error'],correct:1,exp:'5/2 is integer division in Java (both operands are int). Result is 2 (truncates, does not round). For 2.5, you need 5.0/2 or (double)5/2.'},
{id:'j5',topic:'Java',diff:'Easy',q:'Can an interface in Java 8+ have a concrete method?',opts:['No, only abstract methods allowed','Yes, via default and static methods','Yes, but only one concrete method','Only if it extends a class'],correct:1,exp:'Java 8 introduced default methods (concrete with default keyword) and static methods in interfaces. Prior to Java 8, only abstract methods were allowed.'},
{id:'j6',topic:'Java',diff:'Hard',q:'Integer a=200; Integer b=200; System.out.println(a==b);',opts:['true','false','Depends on JVM','Compilation error'],correct:1,exp:'Java caches Integer values from -128 to 127. 200 is outside this range, so each new Integer(200) creates a separate object. == compares references → false. Use .equals() for value comparison.'},
{id:'j7',topic:'Java',diff:'Medium',q:'Which exception is a checked exception?',opts:['NullPointerException','ArrayIndexOutOfBoundsException','IOException','ClassCastException'],correct:2,exp:'IOException is checked — compiler forces you to catch or declare it. NPE, ArrayIndexOutOfBounds, and ClassCastException are unchecked (RuntimeExceptions) — no compiler enforcement.'},
{id:'j8',topic:'Java',diff:'Medium',q:'What happens to a lock when a thread calls wait() inside a synchronized block?',opts:['The lock is held until wait() returns','The lock is temporarily released','The lock is permanently released','Another thread must explicitly release it'],correct:1,exp:'wait() temporarily releases the monitor lock, allowing other synchronized blocks to execute. When notified and reacquired, the thread resumes. sleep() does NOT release the lock.'},
{id:'j9',topic:'Java',diff:'Easy',q:'Which collection maintains insertion order and allows duplicates?',opts:['HashSet','TreeSet','ArrayList','HashMap'],correct:2,exp:'ArrayList maintains insertion order and allows duplicates. HashSet = unordered, no duplicates. TreeSet = sorted, no duplicates. HashMap = key-value, no duplicate keys.'},
{id:'j10',topic:'Java',diff:'Medium',q:'What is the output? ArrayList<Integer> a=new ArrayList<>(); a.add(1);a.add(2); ArrayList<Integer> b=a; b.add(3); System.out.println(a.size());',opts:['2','3','1','Compilation error'],correct:1,exp:'b=a assigns the reference, not a copy. Both a and b point to the same ArrayList object. Adding 3 to b adds to the same object that a references. a.size() = 3.'},
{id:'j11',topic:'Java',diff:'Hard',q:'Which is true about the volatile keyword?',opts:['Guarantees atomicity of compound operations','Prevents threads from caching the variable locally','Makes operations synchronized','Both guarantees atomicity and visibility'],correct:1,exp:'volatile guarantees visibility — all writes are flushed to main memory immediately, so other threads see the latest value. It does NOT guarantee atomicity. count++ (volatile) is still a race condition.'},
{id:'j12',topic:'Java',diff:'Medium',q:'In method overriding, which is NOT allowed?',opts:['Widening the return type covariant','Throwing fewer checked exceptions','Narrowing access modifier (e.g., public to private)','Adding @Override annotation'],correct:2,exp:'The overriding method must have same or wider access. Cannot narrow (e.g., public to protected or private). Can be more accessible. Must throw same or fewer/narrower checked exceptions.'},
{id:'j13',topic:'Java',diff:'Easy',q:'What does the final keyword mean when applied to a reference variable?',opts:['The referenced object cannot be modified','The variable cannot be reassigned to point to another object','Both the reference and object are immutable','The variable is thread-safe'],correct:1,exp:'final on a reference variable means you cannot reassign the reference to point to a different object. The object\'s internal state can still be modified (unless the object\'s class itself is immutable).'},
{id:'j14',topic:'Java',diff:'Medium',q:'What is the time complexity of HashMap.get() in the worst case?',opts:['O(1)','O(log n)','O(n)','O(n log n)'],correct:2,exp:'In the worst case, all keys hash to the same bucket (hash collision). The bucket is then a linked list of all n entries, requiring O(n) to find the key. Java 8+ uses tree (O(log n)) for large buckets, but worst case is O(n).'},
{id:'j15',topic:'Java',diff:'Medium',q:'Which method must be called to start executing a thread\'s run() method?',opts:['run()','start()','execute()','init()'],correct:1,exp:'start() is correct. start() creates a new thread and calls run() in that new thread. Calling run() directly just executes it in the current thread — no new thread is created.'},
// DSA
{id:'d1',topic:'DSA',diff:'Easy',q:'What is the time complexity of binary search?',opts:['O(n)','O(log n)','O(n log n)','O(1)'],correct:1,exp:'Binary search halves the search space each iteration. For n elements, it takes at most log₂n steps. O(log n). Requires a sorted array.'},
{id:'d2',topic:'DSA',diff:'Easy',q:'Which data structure uses LIFO (Last In First Out)?',opts:['Queue','Stack','Priority Queue','Deque (as FIFO)'],correct:1,exp:'Stack uses LIFO — the last element pushed is the first one popped. Queue uses FIFO. A deque can simulate both.'},
{id:'d3',topic:'DSA',diff:'Medium',q:'What is the optimal time complexity for comparison-based sorting?',opts:['O(n)','O(n log n)','O(n²)','O(log n)'],correct:1,exp:'It is mathematically proven that any comparison-based sorting algorithm requires at least O(n log n) comparisons in the worst case. Merge sort and heap sort achieve this optimal bound.'},
{id:'d4',topic:'DSA',diff:'Medium',q:'Two Sum: what data structure gives O(n) average time?',opts:['Binary search tree','Sorted array + two pointers','HashMap (hash table)','Priority queue'],correct:2,exp:'HashMap gives O(1) average lookup. For each element x, check if target-x exists in the map. One pass = O(n) total. Two pointers needs sorted array = O(n log n).'},
{id:'d5',topic:'DSA',diff:'Easy',q:'BFS uses which data structure internally?',opts:['Stack','Queue','Hash map','Priority Queue'],correct:1,exp:'BFS uses a Queue (FIFO). Nodes are added to the back and removed from the front, ensuring level-by-level processing. DFS uses a Stack (or recursion which uses the call stack).'},
{id:'d6',topic:'DSA',diff:'Medium',q:'What is the space complexity of DFS on a tree with n nodes?',opts:['O(1)','O(log n)','O(n)','O(n²)'],correct:2,exp:'DFS uses recursion (call stack) or explicit stack. In the worst case (skewed tree / path graph), the stack depth equals n nodes = O(n). In a balanced tree, O(log n) average depth.'},
{id:'d7',topic:'DSA',diff:'Hard',q:'What is the time complexity of building a max-heap from n elements using heapify?',opts:['O(n log n)','O(n)','O(n²)','O(log n)'],correct:1,exp:'Building a heap using Floyd\'s heapify algorithm is O(n) — not O(n log n). The sum of heapify costs at each level converges to O(n). Inserting n elements one by one would be O(n log n).'},
{id:'d8',topic:'DSA',diff:'Medium',q:'Sliding window technique works best for which type of problems?',opts:['Finding the kth element','Binary tree traversal','Longest/shortest subarray/substring satisfying a constraint','Graph shortest path'],correct:2,exp:'Sliding window is ideal for contiguous subarray/substring problems with a constraint (length, character count, sum). It reduces O(n²) brute force to O(n) by maintaining a window.'},
{id:'d9',topic:'DSA',diff:'Medium',q:'In Kadane\'s algorithm, why initialize with nums[0] instead of 0?',opts:['It\'s just convention','To handle the case when all elements are negative','To avoid index out of bounds','To reduce space complexity'],correct:1,exp:'If all elements are negative, the maximum subarray is still the largest (least negative) single element. Initializing with 0 would incorrectly return 0 as the maximum for an all-negative array.'},
{id:'d10',topic:'DSA',diff:'Easy',q:'Which sorting algorithm has the best worst-case time complexity?',opts:['Quick Sort','Bubble Sort','Merge Sort','Insertion Sort'],correct:2,exp:'Merge Sort guarantees O(n log n) in all cases (best, average, worst). Quick Sort degrades to O(n²) in the worst case (already sorted array with bad pivot selection). Merge Sort\'s downside is O(n) auxiliary space.'},
{id:'d11',topic:'DSA',diff:'Medium',q:'What is the time complexity of in-order traversal of a BST?',opts:['O(log n)','O(n)','O(n log n)','O(1)'],correct:1,exp:'In-order traversal visits every node exactly once → O(n). It produces a sorted sequence when applied to a BST. The height of the tree doesn\'t affect this — every node must be visited.'},
{id:'d12',topic:'DSA',diff:'Hard',q:'Which algorithm finds shortest path in a weighted graph with non-negative weights?',opts:['BFS','DFS','Dijkstra\'s algorithm','Kruskal\'s algorithm'],correct:2,exp:'Dijkstra\'s finds shortest paths from a source in weighted graphs with non-negative weights. BFS finds shortest path in unweighted graphs. Kruskal\'s finds minimum spanning tree, not shortest paths.'},
// DBMS
{id:'db1',topic:'DBMS',diff:'Easy',q:'Which SQL clause filters data AFTER GROUP BY aggregation?',opts:['WHERE','HAVING','ORDER BY','GROUP BY'],correct:1,exp:'HAVING filters groups after GROUP BY aggregation. WHERE filters individual rows BEFORE grouping. You cannot use aggregate functions (COUNT, SUM) in a WHERE clause.'},
{id:'db2',topic:'DBMS',diff:'Easy',q:'What does INNER JOIN return?',opts:['All rows from left table','All rows from right table','Only rows matching the join condition in both tables','All rows from both tables'],correct:2,exp:'INNER JOIN returns rows that have matching values in both tables based on the join condition. Unmatched rows from either table are excluded.'},
{id:'db3',topic:'DBMS',diff:'Medium',q:'Which normal form removes transitive dependencies?',opts:['1NF','2NF','3NF','BCNF'],correct:2,exp:'3NF removes transitive dependencies: where non-key attribute depends on another non-key attribute. 2NF removes partial dependencies (non-key depending on part of composite key). 1NF ensures atomic values.'},
{id:'db4',topic:'DBMS',diff:'Hard',q:'What is a phantom read?',opts:['Reading uncommitted data from another transaction','Reading the same row twice and getting different values','A query returning different rows when run twice in the same transaction','Reading a deleted row'],correct:2,exp:'Phantom read: Transaction A reads a set of rows. Transaction B inserts/deletes rows. Transaction A runs the same query again and gets different rows. Prevented by SERIALIZABLE isolation level.'},
{id:'db5',topic:'DBMS',diff:'Medium',q:'Which operation in SQL does NOT require sorting or hashing internally?',opts:['DISTINCT','GROUP BY','INDEX SEEK on a B-Tree index','ORDER BY'],correct:2,exp:'An index seek (using a B-Tree index) directly navigates to the required rows without sorting. DISTINCT, GROUP BY, and ORDER BY typically require sorting or hashing of intermediate results.'},
{id:'db6',topic:'DBMS',diff:'Easy',q:'A PRIMARY KEY constraint enforces which two conditions?',opts:['Unique and Not Null','Unique and Indexed','Not Null and Foreign Key','Indexed and Not Null'],correct:0,exp:'Primary Key = Unique + Not Null. Every row must have a unique, non-null value for the primary key column(s). A unique index is automatically created, but uniqueness and non-nullness are the key constraints.'},
{id:'db7',topic:'DBMS',diff:'Medium',q:'What is the effect of ON DELETE CASCADE on a foreign key?',opts:['Prevents deletion of parent row if children exist','Auto-deletes child rows when the parent row is deleted','Sets child FK columns to NULL on parent deletion','Raises an error if the parent is deleted'],correct:1,exp:'ON DELETE CASCADE: when a parent row is deleted, all child rows referencing it via foreign key are automatically deleted. This maintains referential integrity automatically.'},
{id:'db8',topic:'DBMS',diff:'Medium',q:'Which is faster for removing ALL rows from a large table?',opts:['DELETE FROM table','TRUNCATE TABLE table','DROP TABLE then recreate','SELECT * with batch delete'],correct:1,exp:'TRUNCATE is much faster — it deallocates data pages in bulk (metadata operation) rather than deleting rows one by one (DELETE). However, TRUNCATE cannot use WHERE and usually cannot be rolled back.'},
{id:'db9',topic:'DBMS',diff:'Hard',q:'A table with columns (A,B,C,D) has FD: A→B, B→C. This violates which normal form?',opts:['1NF','2NF','3NF','BCNF'],correct:2,exp:'B→C means C transitively depends on A via B (A→B→C). C is a non-key attribute depending on another non-key (B). This is a transitive dependency — violates 3NF.'},
{id:'db10',topic:'DBMS',diff:'Medium',q:'What is the difference between RANK() and DENSE_RANK()?',opts:['RANK() sorts ascending; DENSE_RANK() descending','RANK() skips ranks on ties; DENSE_RANK() does not skip','DENSE_RANK() includes NULL; RANK() does not','No difference'],correct:1,exp:'RANK(): ties get same rank, next rank SKIPS (1,1,3). DENSE_RANK(): ties get same rank, next rank is consecutive (1,1,2). ROW_NUMBER(): always unique sequential (1,2,3).'},
{id:'db11',topic:'DBMS',diff:'Easy',q:'Which JOIN type returns rows even when there is no match in the right table?',opts:['INNER JOIN','LEFT JOIN','CROSS JOIN','NATURAL JOIN'],correct:1,exp:'LEFT JOIN (Left Outer Join) returns ALL rows from the left table. For rows with no match in the right table, right-side columns appear as NULL.'},
{id:'db12',topic:'DBMS',diff:'Hard',q:'A correlated subquery differs from a regular subquery because:',opts:['It uses different SQL syntax','The inner query references a column from the outer query','It runs faster than a regular subquery','It cannot use aggregate functions'],correct:1,exp:'In a correlated subquery, the inner query references a column from the outer query. This causes the inner query to execute once per outer row, making it potentially very slow on large tables.'},
// OS
{id:'o1',topic:'OS',diff:'Easy',q:'What memory do threads within the same process share?',opts:['Only the code segment','Stack and heap','Heap, data segment, code — but NOT stack','Everything including stack'],correct:2,exp:'Threads share: heap, code segment, global/static data, open file descriptors. Each thread has its OWN private stack and registers. The stack is not shared because each thread has its own call sequence.'},
{id:'o2',topic:'OS',diff:'Easy',q:'Which deadlock condition requires that a resource be held exclusively?',opts:['Hold and Wait','No Preemption','Circular Wait','Mutual Exclusion'],correct:3,exp:'Mutual Exclusion: a resource can be held by only one process at a time. This is the first Coffman condition. Without mutual exclusion, multiple processes could share the resource and deadlock is impossible.'},
{id:'o3',topic:'OS',diff:'Medium',q:'Which page replacement algorithm suffers from Belady\'s anomaly?',opts:['LRU','Optimal','FIFO','Clock algorithm'],correct:2,exp:'Belady\'s anomaly: adding more page frames can cause MORE page faults with FIFO. LRU and Optimal do not suffer from this. The anomaly shows that more memory doesn\'t always mean fewer page faults.'},
{id:'o4',topic:'OS',diff:'Medium',q:'What does a TLB miss cause?',opts:['Immediate page fault','A full page table walk in memory','OS kernel to load page from disk','Process termination'],correct:1,exp:'TLB miss: the TLB doesn\'t have the translation. The MMU must walk the page table in memory (1-2 additional memory accesses). If the page table entry exists, TLB is updated. If the page isn\'t in memory, THEN a page fault occurs.'},
{id:'o5',topic:'OS',diff:'Easy',q:'Round Robin scheduling uses:',opts:['Priority levels','Time quantum (time slice)','Shortest job first','FIFO queues'],correct:1,exp:'Round Robin assigns a fixed time quantum (e.g., 10ms) to each process in circular order. Prevents any one process from monopolizing CPU. Preemptive — process is context-switched when quantum expires.'},
{id:'o6',topic:'OS',diff:'Medium',q:'What is the key difference between a mutex and a binary semaphore?',opts:['Mutex allows N threads; semaphore allows 1','Mutex has ownership; semaphore does not','Mutex is faster; semaphore is slower','Semaphore is for processes; mutex for threads'],correct:1,exp:'Mutex ownership: only the thread that locked it can unlock it. Binary semaphore has no ownership — any thread can signal (release). This makes mutex safer for mutual exclusion patterns.'},
{id:'o7',topic:'OS',diff:'Easy',q:'What is thrashing?',opts:['Process running too fast for the CPU','CPU spending more time on page faults than executing','Memory running out of addresses','Thread context switching too frequently'],correct:1,exp:'Thrashing: processes have too small a working set in RAM, causing continuous page faults. CPU is mostly busy loading pages from disk rather than executing instructions. CPU utilization drops sharply.'},
{id:'o8',topic:'OS',diff:'Medium',q:'Which scheduling algorithm optimizes average waiting time?',opts:['Round Robin','FCFS','Shortest Job First (non-preemptive)','Priority Scheduling'],correct:2,exp:'SJF (Shortest Job First) provably minimizes average waiting time among non-preemptive algorithms. Its main drawback: requires knowing burst time in advance, which is usually not possible in practice.'},
{id:'o9',topic:'OS',diff:'Medium',q:'What is the purpose of the PCB (Process Control Block)?',opts:['Stores program executable code','Stores all OS information about a process','Manages physical memory pages','Controls CPU cache'],correct:1,exp:'PCB is an OS data structure storing all information about a process: PID, state, program counter, CPU registers, memory management info (page tables), I/O status, priority, scheduling info.'},
{id:'o10',topic:'OS',diff:'Hard',q:'Process A holds Lock1 and waits for Lock2. Process B holds Lock2 and waits for Lock1. This is an example of:',opts:['Starvation','Livelock','Deadlock','Race condition'],correct:2,exp:'This is deadlock — a circular wait where both processes are permanently blocked waiting for each other\'s resources. Starvation = indefinitely waiting but no cycle. Livelock = both actively changing state but making no progress.'},
// NETWORKS
{id:'n1',topic:'Networks',diff:'Easy',q:'How many layers does the OSI model have?',opts:['4','5','7','8'],correct:2,exp:'OSI has 7 layers: Physical, Data Link, Network, Transport, Session, Presentation, Application. TCP/IP model has 4 layers: Network Access, Internet, Transport, Application.'},
{id:'n2',topic:'Networks',diff:'Easy',q:'Which protocol is connectionless and provides no delivery guarantee?',opts:['TCP','HTTP','UDP','FTP'],correct:2,exp:'UDP (User Datagram Protocol) is connectionless. No handshake, no acknowledgments, no ordering guarantees. Faster and lower overhead than TCP. Used for DNS, VoIP, video streaming.'},

{id:'n4',topic:'Networks',diff:'Medium',q:'The TCP three-way handshake sequence is:',opts:['ACK → SYN → SYN-ACK','SYN → SYN-ACK → ACK','SYN → ACK → SYN-ACK','FIN → ACK → FIN-ACK'],correct:1,exp:'TCP 3-way handshake: 1. Client sends SYN(seq=x). 2. Server sends SYN-ACK(seq=y,ack=x+1). 3. Client sends ACK(ack=y+1). Connection established. This synchronizes sequence numbers.'},

/* ─── STORAGE ─────────────────────────────────────────────── */
const Store={
  KEY:'prepmate_v3',
  d:null,
  def(){return{topicStatus:{},mockMistakes:[],mockHistory:[],codingSolved:[],sessions:[],project:{name:'',stack:'',problem:'',arch:'',contribution:'',challenges:'',tradeoffs:'',future:''},focusDuration:60,focusStart:null,focusTopics:0,focusPatterns:0}},
  load(){try{this.d=JSON.parse(localStorage.getItem(this.KEY))||this.def();}catch(e){this.d=this.def();}},
  save(){try{localStorage.setItem(this.KEY,JSON.stringify(this.d));}catch(e){}},
  migrate(){
    try{
      const old=localStorage.getItem('prepmate-done-v2');
      if(old&&!localStorage.getItem(this.KEY)){
        const done=JSON.parse(old)||[];
        const nd=this.def();
        done.forEach(id=>{nd.topicStatus[id]='mastered';});
        localStorage.setItem(this.KEY,JSON.stringify(nd));
      }
    }catch(e){}
  },
  setStatus(id,status){this.d.topicStatus[id]=status;this.save();},
  getStatus(id){return this.d.topicStatus[id]||'notstarted';},
  setSolved(id,v){
    if(v&&!this.d.codingSolved.includes(id)) this.d.codingSolved.push(id);
    else if(!v) this.d.codingSolved=this.d.codingSolved.filter(x=>x!==id);
    this.save();
  },
  isSolved(id){return this.d.codingSolved.includes(id);},
  addMistake(m){this.d.mockMistakes.push(m);this.save();},
  clearMistakes(){this.d.mockMistakes=[];this.save();},
  addSession(s){this.d.sessions.push(s);if(this.d.sessions.length>50)this.d.sessions=this.d.sessions.slice(-50);this.save();},
  reset(){localStorage.removeItem(this.KEY);this.d=this.def();}
};

/* ─── UTILITIES ─────────────────────────────────────────────── */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function highlight(code){
  let h=esc(code);
  h=h.replace(/(\/\/.*$)/gm,'<span style="color:#6a9955">$1</span>');
  h=h.replace(/(".*?"|\'.*?\')/g,'<span style="color:#ce9178">$1</span>');
  h=h.replace(/\b(class|interface|extends|implements|public|private|protected|static|final|void|int|double|boolean|String|new|return|if|else|for|while|try|catch|throws|throw|null|true|false|this|super|abstract|Map|List|Deque|Queue|Arrays|Math|Integer|SELECT|FROM|WHERE|JOIN|ON|GROUP BY|HAVING|ORDER BY|CREATE|TABLE|INSERT|DELETE|UPDATE|AS|AND|OR|NOT|NULL|DISTINCT|INNER|LEFT|RIGHT|COUNT|SUM|AVG|MAX|MIN|OVER|PARTITION BY|RANK|ROW_NUMBER)\b/g,'<span style="color:#569cd6">$1</span>');
  return h;
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._toastT);window._toastT=setTimeout(()=>t.classList.remove('show'),2000);}
function fmtTime(sec){const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function fmtDate(ts){return new Date(ts).toLocaleDateString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
function allTopics(){return Object.values(TOPICS).flat();}
function allTopicsSection(sec){return TOPICS[sec]||[];}

/* ─── PROGRESS ─────────────────────────────────────────────── */
function getProgress(){
  const all=allTopics();
  const mastered=all.filter(t=>Store.getStatus(t.id)==='mastered').length;
  const learned=all.filter(t=>['learning','review','mastered'].includes(Store.getStatus(t.id))).length;
  const secs={java:0,dbms:0,os:0,cn:0,dsa:0};
  Object.keys(TOPICS).forEach(k=>{
    const ts=TOPICS[k];
    secs[k]=ts.length?Math.round(ts.filter(t=>Store.getStatus(t.id)==='mastered').length/ts.length*100):0;
  });
  const pct=all.length?Math.round(mastered/all.length*100):0;
  const patPct=PATTERNS.length?Math.round(Store.d.codingSolved.length/PATTERNS.length*100):0;
  return{pct,mastered,learned,total:all.length,secs,patPct,patSolved:Store.d.codingSolved.length,patTotal:PATTERNS.length,mistakes:Store.d.mockMistakes.length};
}
function getWeakTopics(){
  const all=allTopics();
  return all.filter(t=>{const s=Store.getStatus(t.id);return s==='notstarted'||s==='learning';}).slice(0,6);
}

  if(sec==='dashboard'){mc.innerHTML=wrap(renderDashboard());return;}
  if(TOPICS[sec]){mc.innerHTML=wrap(renderTopics(sec));return;}

  if(sec==='quant'||sec==='logical'||sec==='verbal'){mc.innerHTML=wrap(renderAptitude(sec));return;}

  if(sec==='mistakes'){mc.innerHTML=wrap(renderMistakes());return;}

function saveProject(){

function generatePitch(){

/* ─── MOCK ─────────────────────────────────────────────── */
function renderMockSetup(){
  return `
  <div class="mock-setup">
    <h2>Mock Test</h2>
    <p>MCQ test from Java, DSA, DBMS, OS, and Networks. Timer starts when you begin.</p>
    <div class="mock-opts">
      <button class="mock-ob${State.mockCount===20?' sel':''}" onclick="setMockCount(20,this)">20 Q / 20 min</button>
      <button class="mock-ob${State.mockCount===30?' sel':''}" onclick="setMockCount(30,this)">30 Q / 30 min</button>
      <button class="mock-ob${State.mockCount===60?' sel':''}" onclick="setMockCount(60,this)">60 Q / 60 min</button>
    </div>
    <button class="btn btn-g" style="margin-top:10px" onclick="startMock()">Start Test</button>
  </div>
  <div class="mock-run" id="mock-run">
    <div class="mock-hd"><div id="mock-prog" class="mock-prog"></div><div class="mock-timer" id="mock-timer">00:00</div></div>
    <div id="mock-qc"></div>
    <div class="mock-nav" id="mock-nav"></div>
  </div>
  <div class="mock-res" id="mock-res"></div>`;
}
function setMockCount(n,el){
  State.mockCount=n;document.querySelectorAll('.mock-ob').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');
}
function startMock(){
  const shuffled=[...MCQ].sort(()=>Math.random()-.5).slice(0,Math.min(State.mockCount,MCQ.length));
  State.mockQ=shuffled;State.mockCur=0;State.mockAns={};
  State.mockSec=State.mockCount*60;
  clearInterval(State.mockTimer);
  document.getElementById('mock-run').classList.add('show');
  document.querySelector('.mock-setup').style.display='none';
  State.mockTimer=setInterval(()=>{
    State.mockSec--;
    const el=document.getElementById('mock-timer');
    if(el)el.textContent=fmtTime(State.mockSec);
    if(State.mockSec<=0){clearInterval(State.mockTimer);finishMock();}
  },1000);
  renderMockQ();
}
function renderMockQ(){
  const q=State.mockQ[State.mockCur];
  if(!q)return;
  const ans=State.mockAns[State.mockCur];
  const answered=ans!==undefined;
  document.getElementById('mock-prog').textContent=`Question ${State.mockCur+1} of ${State.mockQ.length}`;
  document.getElementById('mock-qc').innerHTML=`
  <div class="mock-qc">
    <div class="mock-qm"><span class="mock-qt">${esc(q.topic)}</span><span class="mock-qd">${esc(q.diff)}</span></div>
    <div class="mock-question">${esc(q.q)}</div>
    <div class="mock-options">
    ${q.opts.map((o,i)=>{
      let cls='mock-opt';
      if(answered){
        if(i===q.correct)cls+=' correct';
        else if(i===ans)cls+=' wrong';
        cls+=' ';
      }
      return `<button class="mock-opt${answered?(i===q.correct?' correct':i===ans?' wrong':''):''}" ${answered?'disabled':''} onclick="answerMock(${i})">${esc(String.fromCharCode(65+i))}. ${esc(o)}</button>`;
    }).join('')}
    </div>
    <div class="mock-exp${answered?' show':''}" id="mock-exp">${esc(q.exp)}</div>
  </div>`;
  document.getElementById('mock-nav').innerHTML=`
    ${State.mockCur>0?'<button class="btn" onclick="prevMockQ()">← Prev</button>':''}
    ${State.mockCur<State.mockQ.length-1?'<button class="btn btn-g" onclick="nextMockQ()">Next →</button>':''}
    <button class="btn btn-r" onclick="finishMock()">Finish Test</button>`;
}
function answerMock(i){
  if(State.mockAns[State.mockCur]!==undefined)return;
  const q=State.mockQ[State.mockCur];
  State.mockAns[State.mockCur]=i;
  if(i!==q.correct){
    Store.addMistake({qid:q.id,question:q.q,chosen:q.opts[i],correct:q.opts[q.correct],exp:q.exp,topic:q.topic});
  }
  renderMockQ();
  if(State.focusRunning)State.focusTopics++;
}
function nextMockQ(){if(State.mockCur<State.mockQ.length-1){State.mockCur++;renderMockQ();}}
function prevMockQ(){if(State.mockCur>0){State.mockCur--;renderMockQ();}}
function finishMock(){
  clearInterval(State.mockTimer);
  const total=State.mockQ.length;
  const correct=Object.entries(State.mockAns).filter(([i,a])=>a===State.mockQ[i]?.correct).length;
  const answered=Object.keys(State.mockAns).length;
  const timeTaken=State.mockCount*60-State.mockSec;
  Store.addSession({date:Date.now(),durationMin:Math.round(timeTaken/60),topicsStudied:0,patternsVisited:0,mockScore:`${correct}/${total}`});
  document.getElementById('mock-run').classList.remove('show');
  document.getElementById('mock-res').classList.add('show');
  document.getElementById('mock-res').innerHTML=`
  <div class="res-hd">
    <div class="res-score" style="color:${correct/total>=0.7?'var(--green)':correct/total>=0.5?'var(--yellow)':'var(--red)'}">${correct}/${total}</div>
    <div class="res-lbl">${Math.round(correct/total*100)}% correct · ${fmtTime(timeTaken)} taken</div>
    <div class="res-grid">
      <div class="res-stat"><div class="n">${correct}</div><div class="l">Correct</div></div>
      <div class="res-stat"><div class="n" style="color:var(--red)">${answered-correct}</div><div class="l">Wrong</div></div>
      <div class="res-stat"><div class="n" style="color:var(--muted)">${total-answered}</div><div class="l">Skipped</div></div>
    </div>
  </div>
  <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px">
    <button class="btn btn-g" onclick="navigate('mock')">New Test</button>
    <button class="btn" onclick="navigate('mistakes')">Review Mistakes (${Store.d.mockMistakes.length})</button>
  </div>`;
}

/* ─── FOCUS TIMER ─────────────────────────────────────────── */
function renderFocus(){
  return `
  <div class="focus-setup" id="focus-setup">
    <h2>Focus Session</h2>
    <p>Start a timed study session. Stay on PrepMate and study until the timer ends.</p>
    <div class="dur-opts">
      ${[30,60,90,120,240].map(m=>`<button class="dur-btn${State.focusDur===m?' sel':''}" onclick="setDuration(${m},this)"><div class="dm">${m}</div><div>min</div></button>`).join('')}
    </div>
    <button class="btn btn-g" onclick="startFocus()">Start Focus Session</button>
  </div>
  <div class="focus-active" id="focus-active">
    <div class="focus-disp">
      <div class="focus-time" id="focus-time">00:00</div>
      <div class="focus-sub" id="focus-sub">Elapsed · ${State.focusDur} min session</div>
    </div>
    <div class="focus-stats">
      <div class="focus-stat"><div class="n" id="fst-topics">0</div><div class="l">Topics visited</div></div>
      <div class="focus-stat"><div class="n" id="fst-patterns">0</div><div class="l">Patterns seen</div></div>
      <div class="focus-stat"><div class="n" id="fst-remain">--:--</div><div class="l">Remaining</div></div>
    </div>
    <div style="display:flex;gap:7px">
      <button class="btn" id="pause-btn" onclick="pauseFocus()">Pause</button>
      <button class="btn btn-r" onclick="endFocus()">End Session</button>
    </div>
  </div>`;
}
function setDuration(m,el){State.focusDur=m;document.querySelectorAll('.dur-btn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');}
function startFocus(){
  State.focusSec=0;State.focusElapsed=0;State.focusRunning=true;State.focusTopics=0;State.focusPatterns=0;
  document.getElementById('focus-setup').style.display='none';
  document.getElementById('focus-active').classList.add('show');
  clearInterval(State.focusTimer);
  State.focusTimer=setInterval(()=>{
    if(!State.focusRunning)return;
    State.focusElapsed++;State.focusSec++;
    const el=document.getElementById('focus-time');if(el)el.textContent=fmtTime(State.focusElapsed);
    const remain=State.focusDur*60-State.focusElapsed;
    const rel=document.getElementById('fst-remain');if(rel)rel.textContent=remain>0?fmtTime(remain):'Done!';
    const tl=document.getElementById('fst-topics');if(tl)tl.textContent=State.focusTopics;
    const pl=document.getElementById('fst-patterns');if(pl)pl.textContent=State.focusPatterns;
    if(remain<=0){clearInterval(State.focusTimer);toast('Session complete!');endFocus();}
  },1000);
}
function pauseFocus(){
  State.focusRunning=!State.focusRunning;
  const btn=document.getElementById('pause-btn');if(btn)btn.textContent=State.focusRunning?'Pause':'Resume';
}
function endFocus(){
  clearInterval(State.focusTimer);State.focusRunning=false;
  Store.addSession({date:Date.now(),durationMin:Math.round(State.focusElapsed/60),topicsStudied:State.focusTopics,patternsVisited:State.focusPatterns,mockScore:null});
  toast('Session saved!');navigate('history');
}

/* ─── SEARCH ─────────────────────────────────────────────── */
function renderSearch(q){
  const ql=q.toLowerCase().trim();
  if(!ql)return '<div class="empty">Type to search.</div>';
  const results=[];
  const secLabels={java:'Java',dbms:'DBMS',os:'OS',cn:'Networks',dsa:'DSA'};
  Object.entries(TOPICS).forEach(([sec,ts])=>{
    ts.forEach(t=>{
      const hay=[t.title,t.sub,t.what,t.why,t.how,t.trap,t.remember,t.interview].join(' ').toLowerCase();
      if(hay.includes(ql))results.push({type:'topic',sec,id:t.id,title:t.title,snip:t.sub||t.what||''});
    });
  });
  PATTERNS.forEach(p=>{
    const hay=[p.name,p.recognize,p.idea,p.trap].join(' ').toLowerCase();
    if(hay.includes(ql))results.push({type:'pattern',id:p.id,title:p.name,snip:p.recognize});
  });
  Object.entries(BANKS).forEach(([key,items])=>{
    items.forEach((q2,i)=>{
      if(q2.q.toLowerCase().includes(ql)||q2.a.toLowerCase().includes(ql))
        results.push({type:'bank',key,i,title:q2.q,snip:q2.a.substring(0,80)+'…'});
    });
  });
  MCQ.forEach(q2=>{
    if(q2.q.toLowerCase().includes(ql))results.push({type:'mcq',title:q2.q,snip:`${q2.topic} · ${q2.diff}`});
  });
  if(!results.length)return `<div class="empty">No results for "${esc(q)}"</div>`;
  return `<div class="sec-h"><h2>Search Results</h2><p>${results.length} matches for "${esc(q)}"</p></div>`+
  results.slice(0,30).map(r=>`
  <div class="sr-item" onclick="${r.type==='topic'?`navigate('${r.sec}');setTimeout(()=>toggleTopic('${r.id}'),200)`:r.type==='pattern'?`navigate('patterns')`:r.type==='bank'?`navigate('${r.key}-int');setTimeout(()=>toggleInt('${r.key}','${r.i}'),200)`:`navigate('mock')`}">
    <div class="sr-sec">${r.type.toUpperCase()} ${r.sec?'· '+secLabels[r.sec]:r.key?'· '+r.key.toUpperCase():''}</div>
    <div class="sr-title">${esc(r.title)}</div>
    <div class="sr-snip">${esc(r.snip)}</div>
  </div>`).join('');
}

/* ─── EVENTS ─────────────────────────────────────────────── */
function bindEvents(){
  document.getElementById('menuBtn').onclick=()=>{
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  };
  document.getElementById('overlay').onclick=()=>{
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  };
  const doSearch=q=>{State.query=q;if(q){document.getElementById('curSec').textContent='Search';}else{const found=SECTIONS.flatMap(g=>g.items).find(i=>i.id===State.section);document.getElementById('curSec').textContent=found?.label||'Dashboard';}renderMain();};
  document.getElementById('sbSearch').oninput=e=>{document.getElementById('topSearch').value=e.target.value;doSearch(e.target.value);};
  document.getElementById('topSearch').oninput=e=>{document.getElementById('sbSearch').value=e.target.value;doSearch(e.target.value);};
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('topSearch').focus();}});
  document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset ALL progress? This cannot be undone.')){Store.reset();Store.load();renderSidebar();renderMain();toast('Progress reset.');}};
}

/* ─── INIT ─────────────────────────────────────────────── */
Store.migrate();
Store.load();
navigate('dashboard');
bindEvents();
</script>
