  .track-grid{grid-template-columns:1fr}.track-title{font-size:19px}
}
@media(max-width:390px){.top-search{width:105px}.res-grid{grid-template-columns:1fr}.topbar{padding-left:10px;padding-right:10px}}

const MPHASIS_TRACK=[
 {n:1,id:'java',title:'Java Fundamentals + OOP',copy:'JVM, memory, Strings, exceptions, collections, OOP, interfaces, polymorphism and multithreading.'},
 {n:2,id:'java-int',title:'Java Interview Bank',copy:'Say the answer aloud, then handle the follow-up and trap.'},
 {n:3,id:'dbms',title:'SQL + DBMS',copy:'Joins, normalization, ACID, indexes, subqueries, window functions and query patterns.'},
 {n:4,id:'spring',title:'Spring Boot + REST',copy:'Core Spring concepts, dependency injection, controllers, validation, JPA and REST design.'},
 {n:5,id:'project-bank',title:'BankLite Project Defense',copy:'Architecture, API flow, database design, security and trade-offs.'},
 {n:6,id:'project-resolve',title:'ResolveHub Project Defense',copy:'Workflow design, JWT auth, MongoDB modeling, Gemini integration and trade-offs.'},

 {n:11,id:'quickrev',title:'Git + SDLC + Agile',copy:'Fast interview revision for Git, branches, pull requests, CI/CD, SDLC and Agile ceremonies.'},

];

const TRACK_ALIASES={spring:'Spring', 'project-bank':'BankLite','project-resolve':'ResolveHub','project-pixel':'PixelParadox + AWS'};
const TOPICS={
java:[
{id:'jdk',title:'JDK vs JRE vs JVM',sub:'Java runtime stack and bytecode portability',tags:['Most Asked'],what:'JDK = development toolkit (includes javac compiler). JRE = runtime environment (JVM + standard libraries). JVM = virtual machine that executes bytecode.',why:'Platform independence — Java compiles to bytecode (not native code), and any machine with a JVM can run it.',how:'Source (.java) → javac → bytecode (.class) → JVM loads + verifies → JIT compiles hot code → CPU executes.',example:'javac Hello.java → Hello.class (bytecode). That .class runs unchanged on Windows, Linux, or Mac.',diagram:'JDK\n├─ javac (compiler)\n└─ JRE\n   ├─ JVM (Class Loader → Verifier → JIT → GC)\n   └─ Core Libraries (java.lang, java.util...)',interview:'Is the JVM platform-independent?',trap:'JVM is NOT platform-independent — each OS has its own JVM binary. BYTECODE is portable, not the JVM.',remember:'"Write once, run anywhere" = bytecode portability. JVM itself is OS-specific.',checks:[{q:'What does javac produce?',a:'Bytecode (.class files), not native machine code.'},{q:'Which component includes javac?',a:'JDK (Java Development Kit).'},{q:'Can a program run with only JRE installed?',a:'Yes — JRE contains the JVM needed to run .class files. JDK is only needed for development.'}]},
{id:'stack-heap',title:'Stack vs Heap Memory',sub:'Where local variables and objects actually live',tags:['Most Asked','Trap'],what:'Stack = per-thread memory for method frames, local variables, references. Heap = shared memory for all objects, managed by GC.',why:'Stack enables fast LIFO allocation for function calls. Heap supports dynamic object creation of any size.',how:'Each method call creates a stack frame (local vars, return address). Objects are heap-allocated; the stack holds references (pointers) to them.',example:'int x=5 → value 5 stored on stack. String s="hi" → reference on stack, String object on heap.',trap:'StackOverflowError = too many recursive calls (stack full). OutOfMemoryError = heap full.',interview:'Where are local variables stored vs objects?',remember:'Primitives and references live on stack. Objects live on heap.',checks:[{q:'Where is a new ArrayList stored?',a:'Object lives on heap; the reference variable lives on stack.'},{q:'What causes StackOverflowError?',a:'Infinite or very deep recursion exhausting the call stack.'}]},
{id:'string-pool',title:'String, == vs equals(), String Pool',sub:'The classic Java trap interviewers always ask',tags:['Most Asked','Trap'],what:'String pool = JVM cache for string literals. == compares references (addresses). equals() compares content.',why:'Strings are immutable, so JVM can safely reuse literal objects via intern pool — saves memory.',how:'"hello" == "hello" → true. new String("hello") == "hello" → false. "hello".equals(new String("hello")) → true.',code:'String a = "java";\nString b = "java";\nString c = new String("java");\nSystem.out.println(a == b);       // true\nSystem.out.println(a == c);       // false\nSystem.out.println(a.equals(c));  // true',trap:'new String("x") creates a new object; == checks identity, not content.',interview:'Why does new String("hello") == "hello" return false?',remember:'== checks identity. equals() checks content.',checks:[{q:'When should you use equals() for Strings?',a:'For content comparison, essentially always unless you explicitly want reference identity.'}]},
{id:'oop',title:'OOP — 4 Pillars',sub:'Encapsulation, Inheritance, Polymorphism, Abstraction',tags:['Most Asked'],what:'Encapsulation = hide state behind methods. Inheritance = share behavior. Polymorphism = one interface, many implementations. Abstraction = hide complexity.',why:'Each pillar solves a design problem: access control, reuse, flexible behavior, and simplified interfaces.',how:'Encap: private fields + methods. Inherit: extends. Poly: overriding + interfaces. Abstract: abstract class or interface.',code:'interface Shape { void draw(); }\nclass Circle implements Shape {\n  private int r;\n  public void draw(){ System.out.println("Circle r="+r); }\n}',trap:'Abstraction ≠ encapsulation. Abstraction hides complexity; encapsulation controls access to state.',interview:'Explain polymorphism with a real example.',remember:'Encap=hide data. Inherit=share code. Poly=same call, different behavior. Abstract=hide complexity.',checks:[{q:'Can a class extend two classes in Java?',a:'No. Use interfaces for multiple-type inheritance.'},{q:'What is runtime polymorphism?',a:'Method overriding, where the chosen implementation depends on the runtime object type.'}]},
{id:'interface-abstract',title:'Interface vs Abstract Class',sub:'Common design and OOP follow-up',tags:['Most Asked'],what:'Interface = contract; abstract class = partial implementation plus contract.',why:'Interfaces support multiple inheritance of type; abstract classes allow shared state and implementation.',how:'A class implements multiple interfaces but extends one class. Interfaces can have default/static methods.',trap:'Since Java 8, interfaces can have concrete default/static methods.',interview:'When would you prefer an abstract class?',remember:'Interface = contract and multiple. Abstract class = shared behavior/state and one parent.',checks:[{q:'Can a Java class implement multiple interfaces?',a:'Yes.'},{q:'Can an interface have constructors?',a:'No.'}]},
{id:'overload-override',title:'Overloading vs Overriding',sub:'Compile-time vs runtime dispatch',tags:['Most Asked','Trap'],what:'Overloading = same method name, different parameters, compile-time. Overriding = same signature in child class, runtime.',why:'Overloading improves API convenience; overriding enables runtime polymorphism.',how:'Compiler resolves overloaded method; JVM dispatches overridden instance method based on runtime object.',trap:'Static methods are hidden, not overridden. Return type alone cannot overload a method.',interview:'Can you override a static method?',remember:'Overload = compile time. Override = runtime.',checks:[{q:'Can you overload by return type only?',a:'No.'}]},
{id:'exceptions',title:'Exception Handling',sub:'Checked vs unchecked, throw/throws, cleanup',tags:['Most Asked'],what:'Checked exceptions are compiler-enforced. Unchecked exceptions extend RuntimeException.',why:'Exceptions make failure paths explicit and allow recovery or clean propagation.',how:'throw raises; throws declares; try/catch handles; finally is cleanup; try-with-resources auto-closes resources.',code:'void read() throws IOException {\n  try(BufferedReader br = new BufferedReader(new FileReader(path))){\n    return br.readLine();\n  }\n}',trap:'Do not silently swallow exceptions with an empty catch block.',interview:'When would you use a checked vs unchecked exception?',remember:'Checked = compiler-enforced. Unchecked = RuntimeException.',checks:[{q:'Does finally run before return from try?',a:'Yes, barring abnormal JVM termination such as System.exit().'},{q:'What is try-with-resources?',a:'Automatic closing of Closeable/AutoCloseable resources.'}]},
{id:'collections',title:'Collections — ArrayList, LinkedList, HashMap, HashSet',sub:'Core Java data structures',tags:['Most Asked'],what:'ArrayList = dynamic array. LinkedList = linked nodes. HashMap = key/value hash table. HashSet = unique values backed by hashing.',why:'Interviewers test API choice plus time complexity and hashing behavior.',how:'ArrayList get O(1), middle insert O(n). LinkedList get O(n). HashMap get/put O(1) average. HashSet uses hashCode + equals.',code:'Map<String,Integer> freq = new HashMap<>();\nfor(String w : words) freq.put(w, freq.getOrDefault(w,0)+1);',trap:'Equal objects must have equal hashCodes. Override equals() and hashCode() together.',interview:'How does HashMap handle collisions?',remember:'hashCode → bucket → equals confirms key.',checks:[{q:'Which List is better for random access?',a:'ArrayList.'},{q:'Can HashMap have null keys?',a:'Yes, one null key.'}]},
{id:'multithreading',title:'Multithreading',sub:'synchronized, volatile, race condition, deadlock',tags:['Most Asked','Trap'],what:'Threads share process memory. synchronized provides mutual exclusion; volatile provides visibility.',why:'Concurrent access can create races and inconsistent state.',how:'Thread states include NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING, TERMINATED.',code:'class Counter {\n  private int count;\n  public synchronized void increment(){ count++; }\n}',trap:'volatile does not make count++ atomic. Use synchronized or AtomicInteger for compound operations.',interview:'volatile vs synchronized?',remember:'synchronized = exclusivity + visibility. volatile = visibility, not atomicity.',checks:[{q:'What is a race condition?',a:'Concurrent unsynchronized access produces results depending on timing/interleaving.'}]}
],
dbms:[
{id:'keys',title:'Database Keys — PK, FK, Candidate, Super',sub:'Identity and relationships',tags:['Most Asked'],what:'Primary key uniquely identifies a row. Foreign key references a key in another table. Candidate key is a minimal unique identifier. Super key is any superset of a candidate key.',why:'Keys enforce entity and referential integrity.',how:'A table can have many candidate keys but one chosen primary key. Composite keys use multiple columns.',trap:'Multiple candidate keys are allowed; exactly one primary key is chosen.',interview:'Candidate key vs primary key?',remember:'PK = selected candidate key. FK = reference to parent key.',checks:[{q:'Can PK be NULL?',a:'No.'},{q:'Can FK be NULL?',a:'Yes, unless constrained otherwise.'}]},
{id:'normalization',title:'Normalization — 1NF, 2NF, 3NF, BCNF',sub:'Redundancy and anomalies',tags:['Most Asked'],what:'Normalization structures tables to reduce redundancy and update anomalies.',why:'Prevents inconsistent updates and accidental loss of information.',how:'1NF atomic. 2NF removes partial dependency. 3NF removes transitive dependency. BCNF requires every determinant to be a super key.',trap:'Normalization can increase joins. Performance-driven systems sometimes denormalize deliberately.',interview:'2NF vs 3NF?',remember:'1NF=atomic, 2NF=no partial dependency, 3NF=no transitive dependency.',checks:[{q:'What is a transitive dependency?',a:'A non-key attribute depends on another non-key attribute, creating indirect dependency on the key.'}]},
{id:'joins',title:'SQL Joins — INNER, LEFT, RIGHT, FULL',sub:'Combining related tables',tags:['Most Asked'],what:'INNER returns matches. LEFT keeps all left rows. RIGHT keeps all right rows. FULL keeps all rows from both.',why:'Normalized information is split across related tables.',how:'Use ON for relationship logic. LEFT JOIN + WHERE right.id IS NULL finds unmatched left rows.',code:'SELECT s.name, d.dept_name\nFROM students s\nLEFT JOIN departments d ON d.id=s.dept_id;',trap:'WHERE filters on the right table can turn a LEFT JOIN into an INNER-like result.',interview:'Find records in A with no match in B.',remember:'LEFT JOIN + right.id IS NULL = left-only rows.',checks:[{q:'What does LEFT JOIN return for unmatched right columns?',a:'NULLs.'}]},
{id:'group-having',title:'GROUP BY, HAVING, WHERE, Aggregates',sub:'Classic SQL execution and filtering',tags:['Most Asked','Trap'],what:'GROUP BY creates groups. WHERE filters rows before grouping. HAVING filters groups after aggregation.',why:'Interviews test whether you understand query processing order.',how:'FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.',code:'SELECT dept_id, COUNT(*)\nFROM employees\nWHERE salary>50000\nGROUP BY dept_id\nHAVING COUNT(*)>5;',trap:'COUNT/SUM/AVG cannot be used in WHERE.',interview:'Departments with more than five employees.',remember:'WHERE = rows, HAVING = groups.',checks:[{q:'COUNT(*) vs COUNT(col)?',a:'COUNT(*) counts rows; COUNT(col) ignores NULLs in the column.'}]},
{id:'indexes',title:'Indexes — How and Why They Help',sub:'Read speed vs write cost',tags:['Most Asked'],what:'Indexes are auxiliary structures, commonly B-trees, used to speed filtering, lookup and ordering.',why:'Without a useful index a query may scan many rows; indexes can narrow the search substantially.',how:'The database maintains index entries on writes. A good index matches frequent WHERE/JOIN/ORDER patterns.',trap:'More indexes are not free. Inserts/updates/deletes must maintain them.',interview:'When can an index hurt performance?',remember:'Indexes trade write overhead and space for faster reads.',checks:[{q:'Why not index every column?',a:'Maintenance cost, storage, and low-selectivity indexes may not provide enough benefit.'}]},
{id:'acid',title:'ACID Transactions + Isolation',sub:'Correctness under concurrent transactions',tags:['Most Asked'],what:'Atomicity, Consistency, Isolation, Durability describe transaction guarantees.',why:'Applications like banking need predictable outcomes during concurrency and failures.',how:'Know dirty reads, non-repeatable reads, phantoms, and the usual isolation-level progression.',trap:'ACID consistency is not the same concept as CAP consistency.',interview:'What is a dirty read?',remember:'READ COMMITTED prevents dirty reads.',checks:[{q:'What does rollback do?',a:'Undoes uncommitted changes in the current transaction.'}]},
{id:'subqueries',title:'Subqueries + Correlated Subqueries',sub:'Nested filtering and performance',tags:['Often Asked'],what:'A subquery is a query inside another statement. Correlated subqueries reference outer-row values.',why:'Useful for comparisons against aggregates or related sets.',how:'Regular subquery may execute once; correlated subquery conceptually executes per outer row and can be expensive.',trap:'Always inspect query plans before assuming a correlated subquery is slow, but know the common rewrite to JOIN.',interview:'Correlated vs non-correlated?',remember:'Correlated = depends on current outer row.',checks:[{q:'What can replace many correlated subqueries?',a:'A JOIN, CTE, aggregation, or window function depending on the problem.'}]},
{id:'sql-patterns',title:'SQL Interview Query Patterns',sub:'Duplicates, Nth highest, ranking, running totals',tags:['OA Pattern'],what:'Repeated interview patterns matter more than memorizing isolated queries.',why:'Interviewers want you to translate a requirement into relational operations quickly.',how:'Practice GROUP BY/HAVING, subqueries, CTEs, window functions, joins and NULL handling.',code:'SELECT name, salary,\nDENSE_RANK() OVER(PARTITION BY dept_id ORDER BY salary DESC) AS rnk\nFROM employees;',trap:'RANK has gaps after ties; DENSE_RANK does not; ROW_NUMBER always increments.',interview:'Find the second highest salary.',remember:'Window functions use OVER() and preserve row detail.',checks:[{q:'What does PARTITION BY do?',a:'Creates independent windows without collapsing rows.'}]}
],
os:[
{id:'process-thread',title:'Process vs Thread',sub:'Isolation vs shared-memory concurrency',tags:['Most Asked'],what:'Process has its own address space. Threads within a process share heap/code/data but have separate stacks and registers.',why:'Processes provide isolation; threads offer cheaper concurrency.',how:'PCB stores process state. Threads have their own execution state while sharing process resources.',trap:'A fatal thread-level failure can terminate the whole process.',interview:'What memory do threads share?',remember:'Shared heap, own stack.',checks:[{q:'Do threads have separate stacks?',a:'Yes.'}]},
{id:'scheduling',title:'CPU Scheduling Algorithms',sub:'FCFS, SJF, Round Robin, Priority',tags:['Often Asked'],what:'Schedulers decide which ready process/thread receives CPU time.',why:'Balance utilization, throughput, waiting time, turnaround and fairness.',how:'FCFS simple but convoy effect. SJF minimizes average wait under assumptions. RR is fair. Priority can starve low-priority work.',trap:'Use aging to reduce starvation in priority scheduling.',interview:'Disadvantage of FCFS?',remember:'FCFS=convoy, SJF=low average wait, RR=fair, Priority=starvation risk.',checks:[{q:'Which algorithm is preemptive by design?',a:'Round Robin.'}]},
{id:'synchronization',title:'Mutex, Semaphore, Race Condition',sub:'Protect shared resources',tags:['Most Asked','Trap'],what:'Mutex gives exclusive ownership. Semaphore is a counter for signaling/resource limits. Race condition is incorrect timing-dependent access.',why:'Concurrent code needs clear ownership and atomicity.',how:'Critical sections need synchronization. Binary semaphore is similar to a mutex but does not imply ownership semantics.',trap:'A mutex should be unlocked by the owning thread; a semaphore may be signaled by a different thread.',interview:'Mutex vs semaphore?',remember:'Mutex = ownership + exclusion. Semaphore = count + signaling.',checks:[{q:'What is a critical section?',a:'A region that accesses shared state and must be protected from conflicting concurrent execution.'}]},
{id:'deadlock',title:'Deadlock — 4 Conditions + Prevention',sub:'Circular waits and resource dependencies',tags:['Most Asked'],what:'Deadlock occurs when processes/threads wait forever due to a cycle of resource dependencies.',why:'Recognizing the Coffman conditions lets you reason about prevention.',how:'Mutual exclusion, hold-and-wait, no preemption, circular wait are all necessary. Prevent by breaking one, commonly circular wait via lock ordering.',trap:'Starvation is different: there need not be a cycle.',interview:'How do you prevent deadlock?',remember:'Consistent lock ordering is the practical favorite answer.',checks:[{q:'List the Coffman conditions.',a:'Mutual exclusion, hold-and-wait, no preemption, circular wait.'}]},
{id:'paging',title:'Paging, Virtual Memory, Page Faults',sub:'Virtual-to-physical memory mapping',tags:['Most Asked'],what:'Virtual pages map to physical frames through page tables; page faults happen when a page is not resident.',why:'Virtual memory provides process isolation and lets systems overcommit physical RAM.',how:'CPU checks TLB, then page table, then handles a page fault by loading the page if absent.',trap:'Thrashing is excessive paging; adding more processes can make it worse.',interview:'What is a page fault?',remember:'TLB caches translations; page fault means page is not currently resident.',checks:[{q:'What is internal fragmentation?',a:'Unused space inside an allocated fixed-size page/frame.'}]},
{id:'context-switch',title:'Context Switch',sub:'Saving and restoring execution state',tags:['Often Asked'],what:'The OS saves current execution state and loads another task state.',why:'Enables multitasking on shared CPUs.',how:'Registers, program counter and scheduler state are saved/restored. Switching has overhead.',trap:'Too many switches reduce useful CPU work.',interview:'What happens during a context switch?',remember:'Save current state → load next state.',checks:[{q:'Why can thread switches be cheaper than process switches?',a:'Threads can share an address space, reducing address-space management work.'}]}
],
cn:[
{id:'osi',title:'OSI Model — 7 Layers',sub:'Application to Physical',tags:['Most Asked'],what:'A seven-layer conceptual model for network communication.',why:'Helps reason about protocols and responsibilities at each layer.',how:'Application, Presentation, Session, Transport, Network, Data Link, Physical.',trap:'Router = L3, switch = L2, hub = L1.',interview:'At which layer does TCP operate?',remember:'TCP=4, IP=3, Ethernet/MAC=2.',checks:[{q:'At what layer does IP operate?',a:'Layer 3.'}]},
{id:'tcp-udp',title:'TCP vs UDP',sub:'Reliable ordered delivery vs lightweight best-effort',tags:['Most Asked'],what:'TCP is connection-oriented and reliable. UDP is connectionless and best-effort.',why:'Applications choose based on latency, reliability and ordering needs.',how:'TCP uses handshake, sequence numbers, ACKs, retransmission, flow and congestion control. UDP does not.',trap:'UDP is intentionally lightweight, not broken TCP.',interview:'Why might DNS use UDP?',remember:'TCP = reliable; UDP = low overhead.',checks:[{q:'What does the TCP handshake establish?',a:'Connection state and synchronized sequence information.'}]},
{id:'ip-mac-arp',title:'IP, MAC, ARP, DNS, DHCP',sub:'Addressing and name resolution',tags:['Most Asked'],what:'IP routes between networks, MAC delivers within a LAN, ARP resolves IP to MAC, DNS resolves names to IPs, DHCP configures network parameters.',why:'Each protocol solves a different layer of identity/configuration problem.',how:'Know the browser cache → DNS → gateway MAC via ARP → TCP/TLS → HTTP flow.',trap:'Routers do not forward the same MAC address end-to-end.',interview:'Walk me through google.com in a browser.',remember:'DNS=name→IP, ARP=IP→MAC, DHCP=configuration.',checks:[{q:'What is DHCP DORA?',a:'Discover, Offer, Request, Acknowledge.'}]},
{id:'http-https',title:'HTTP, HTTPS, REST, Status Codes',sub:'Web protocol fundamentals',tags:['Most Asked'],what:'HTTP is a stateless request/response application protocol; HTTPS is HTTP over TLS.',why:'Backend engineers must understand methods, status codes and secure transport.',how:'GET retrieves, POST creates/actions, PUT replaces, PATCH partially updates, DELETE removes. Know 200/201/204/400/401/403/404/409/500.',trap:'401 means authentication is missing/invalid; 403 means authenticated/recognized but not allowed.',interview:'401 vs 403?',remember:'HTTPS = HTTP + TLS.',checks:[{q:'Which common HTTP methods are idempotent?',a:'GET, PUT and DELETE are idempotent by HTTP semantics; POST is not generally idempotent.'}]},
{id:'tcp-handshake',title:'TCP Handshake + Flow/Congestion Control',sub:'Connection setup and rate control',tags:['Often Asked'],what:'TCP uses SYN, SYN-ACK, ACK to establish a connection.',why:'Prepares state and sequence information and protects network/receiver capacity.',how:'Flow control depends on receiver capacity; congestion control reacts to network capacity and loss.',trap:'Closing is typically a four-way FIN/ACK exchange.',interview:'Flow vs congestion control?',remember:'Flow=receiver. Congestion=network.',checks:[{q:'What is TCP slow start?',a:'A congestion-control phase that begins with a small congestion window and grows it rapidly until a threshold/loss event.'}]}
],
dsa:[

const Store={
KEY:'prepmate_v3',d:null,
def(){return{topicStatus:{},mockMistakes:[],mockHistory:[],codingSolved:[],sessions:[],project:{name:'',stack:'',problem:'',arch:'',contribution:'',challenges:'',tradeoffs:'',future:''}};},
load(){try{this.d=JSON.parse(localStorage.getItem(this.KEY))||this.def();}catch(e){this.d=this.def();}},
save(){try{localStorage.setItem(this.KEY,JSON.stringify(this.d));}catch(e){}},
migrate(){try{const old=localStorage.getItem('prepmate-done-v2');if(old&&!localStorage.getItem(this.KEY)){const done=JSON.parse(old)||[];const nd=this.def();done.forEach(id=>nd.topicStatus[id]='mastered');localStorage.setItem(this.KEY,JSON.stringify(nd));}}catch(e){}},
setStatus(id,status){this.d.topicStatus[id]=status;this.save();},getStatus(id){return this.d.topicStatus[id]||'notstarted';},
setSolved(id,v){if(v&&!this.d.codingSolved.includes(id))this.d.codingSolved.push(id);else if(!v)this.d.codingSolved=this.d.codingSolved.filter(x=>x!==id);this.save();},
isSolved(id){return this.d.codingSolved.includes(id);},addMistake(m){this.d.mockMistakes.push(m);this.save();},clearMistakes(){this.d.mockMistakes=[];this.save();},
addSession(s){this.d.sessions.push(s);if(this.d.sessions.length>50)this.d.sessions=this.d.sessions.slice(-50);this.save();},
reset(){localStorage.removeItem(this.KEY);this.d=this.def();}
};

function fmtTime(sec){const m=Math.floor(Math.max(0,sec)/60),s=Math.max(0,sec)%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}

function renderTopics(sec){
 const ts=TOPICS[sec]||[];const labels={java:'Java Fundamentals + OOP',dbms:'DBMS + SQL',os:'Operating Systems',cn:'Computer Networks + HTTP',dsa:'DSA Concepts'};const descs={java:'JVM, memory, Strings, OOP, collections, exceptions and multithreading.',dbms:'Keys, normalization, joins, transactions, indexes and interview SQL patterns.',os:'Processes, threads, scheduling, synchronization, deadlock and memory.',cn:'TCP/UDP, DNS, TLS, HTTP, REST, CORS, routing and NAT.',dsa:'Big-O, arrays, strings, trees, graphs and core patterns.'};

function topicCard(t){
 const tagHtml=t.tags.map(tg=>`<span class="tag ${tg.includes('Trap')?'tag-trap':(tg.includes('Most')||tg.includes('OA')||tg.includes('Often')?'tag-hot':'tag-blue')}">${esc(tg)}</span>`).join('');
 return `<div class="topic-card" id="tc-${t.id}"><div class="topic-hd" onclick="toggleTopic('${t.id}')"><div class="topic-tr"><div class="topic-title">${esc(t.title)}</div><div class="topic-sub">${esc(t.sub||'')}</div><div class="topic-meta">${tagHtml}</div></div>${sBadge(t.id)}</div>
 <div class="topic-bd" id="tb-${t.id}"><div class="t-grid"><div class="t-blk"><div class="blk-lbl">What</div><div class="blk-val">${esc(t.what)}</div></div><div class="t-blk"><div class="blk-lbl">Why</div><div class="blk-val">${esc(t.why)}</div></div><div class="t-blk t-blk-full"><div class="blk-lbl">How</div><div class="blk-val">${esc(t.how)}</div></div>${t.example?`<div class="t-blk t-blk-full"><div class="blk-lbl">Example</div><div class="blk-val">${esc(t.example)}</div></div>`:''}<div class="t-blk blk-int"><div class="blk-lbl">Interview Question</div><div class="blk-val">${esc(t.interview)}</div></div><div class="t-blk blk-trap"><div class="blk-lbl">Trap</div><div class="blk-val">${esc(t.trap)}</div></div><div class="t-blk blk-rem t-blk-full"><div class="blk-lbl">Remember</div><div class="blk-val">${esc(t.remember)}</div></div></div>
 ${t.diagram?`<div class="diagram">${esc(t.diagram)}</div>`:''}${t.code?`<pre><code>${highlight(t.code)}</code></pre>`:''}${t.checks?.length?`<div class="checks"><div class="blk-lbl" style="margin-top:10px;margin-bottom:5px">Quick Check</div>${t.checks.map(c=>`<div class="check-item" onclick="this.classList.toggle('rev')"><div class="check-q">${esc(c.q)}</div><div class="check-a">→ ${esc(c.a)}</div></div>`).join('')}</div>`:''}
 <div class="t-acts"><button class="btn" onclick="setStatus('${t.id}','learning')">Learning</button><button class="btn" onclick="setStatus('${t.id}','review')">Review</button><button class="btn btn-g" onclick="setStatus('${t.id}','mastered')">✓ Mastered</button><button class="btn" onclick="setStatus('${t.id}','notstarted')">Reset</button></div></div></div>`;
}
function toggleTopic(id){const bd=document.getElementById('tb-'+id);if(bd){bd.classList.toggle('open');if(bd.classList.contains('open')&&Store.getStatus(id)==='notstarted'){setStatus(id,'learning');}}}
function setStatus(id,status){
 Store.setStatus(id,status);const sb=document.querySelector('#tc-'+id+' .sbadge');if(sb)sb.outerHTML=sBadge(id);updateProgress();toast('Status: '+({notstarted:'Not Started',learning:'Learning',review:'Review',mastered:'Mastered'}[status]));

 ${SPRING.map((x,i)=>`<div class="int-item" id="spring-${i}"><div class="int-q" onclick="document.getElementById('spring-${i}').classList.toggle('open')"><span>${esc(x[0])}</span><span class="int-chev">▶</span></div><div class="int-bd"><div class="int-f"><div class="int-f-l">Interview Answer</div><div class="int-f-v">${esc(x[1])}</div></div><div class="int-trap">⚠ Follow-up: explain one real example from BankLite or ResolveHub.</div></div></div>`).join('')}`;

function renderProjectDefense(id){
 const p=PROJECTS[id];
 return `<div class="sec-h"><h2>${esc(p.name)} Defense</h2><p>${esc(p.stack)} · Defend the implementation, not the README.</p></div>
 <div class="proj-ed"><h3>Defense worksheet</h3><div class="fg">

 <div class="ff"><label class="fl">Key Tradeoff</label><textarea class="fi" id="pj-trade" rows="2">${esc(Store.d.project.tradeoffs||p.tradeoffs)}</textarea></div>
 <div class="ff full"><label class="fl">What I Would Improve</label><textarea class="fi" id="pj-future" rows="2">${esc(Store.d.project.future||p.future)}</textarea></div>
 </div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px"><button class="btn btn-g" onclick="saveProject()">Save</button><button class="btn" onclick="generatePitch('${id}')">Generate 90-sec Pitch</button></div><div class="pitch-out" id="pitch-out"></div></div>
 <div class="sec-h" style="margin-top:16px"><h2>Likely interviewer questions</h2></div>
 ${p.questions.map(q=>`<div class="int-item"><div class="int-q" onclick="this.parentElement.classList.toggle('open')"><span>${esc(q)}</span><span class="int-chev">▶</span></div><div class="int-bd"><div class="int-f"><div class="int-f-l">How to answer</div><div class="int-f-v">Answer with the real implementation detail, then the reason/trade-off. Never invent a feature.</div></div></div></div>`).join('')}`;

function saveProject(){const f=k=>document.getElementById(k)?.value||'';Store.d.project={name:f('pj-name'),stack:f('pj-stack'),problem:f('pj-problem'),arch:f('pj-arch'),contribution:f('pj-contrib'),challenges:f('pj-chal'),tradeoffs:f('pj-trade'),future:f('pj-future')};Store.save();toast('Project saved');}
function generatePitch(id){
 saveProject();const p=PROJECTS[id];const d=Store.d.project;const pitch=`PROJECT: ${d.name||p.name}\nSTACK: ${d.stack||p.stack}\n\nProblem: ${d.problem}\n\nArchitecture: ${d.arch}\n\nMy contribution: ${d.contribution}\n\nHardest challenge: ${d.challenges}\n\nTrade-off: ${d.tradeoffs}\n\nImprovement: ${d.future}`;const el=document.getElementById('pitch-out');if(el){el.textContent=pitch;el.classList.add('show');}
}
function renderPatterns(){return `<div class="sec-h"><h2>DSA Patterns</h2><p>Focus on recognizing constraints and explaining your approach, not memorizing code.</p><div style="font-size:11px;color:var(--muted);margin-top:4px">${Store.d.codingSolved.length}/${PATTERNS.length} solved</div></div><div class="pat-grid">${PATTERNS.map(p=>`<div class="pat-card"><div class="pat-hd"><div class="pat-name">${esc(p.name)}</div><div class="solved-cb${Store.isSolved(p.id)?' done':''}" onclick="toggleSolved('${p.id}',this)">${Store.isSolved(p.id)?'✓':''}</div></div><div class="pat-cx">${esc(p.cx)}</div><div class="pat-fl" style="margin-top:8px"><div class="pat-fl-l">Recognize</div><div class="pat-fl-v">${esc(p.recognize)}</div></div><div class="pat-fl"><div class="pat-fl-l">Core idea</div><div class="pat-fl-v">${esc(p.idea)}</div></div><div class="pat-fl"><div class="pat-fl-l" style="color:var(--red)">Trap</div><div class="pat-fl-v">${esc(p.trap)}</div></div><pre style="margin-top:6px"><code>${highlight(p.code)}</code></pre><div class="pat-probs">${p.problems.map(pr=>`<span class="prob-tag">${esc(pr)}</span>`).join('')}</div></div>`).join('')}</div>`;}
function toggleSolved(id,el){const v=!Store.isSolved(id);Store.setSolved(id,v);el.className='solved-cb'+(v?' done':'');el.textContent=v?'✓':'';updateProgress();toast(v?'Pattern solved!':'Unmarked');}
function renderAptitude(type){const labels={quant:'Quantitative Aptitude',logical:'Logical Reasoning',verbal:'Verbal Ability'};return `<div class="sec-h"><h2>${labels[type]}</h2><p>Compact placement reference.</p></div><div class="apt-grid">${(APT[type]||[]).map(c=>`<div class="apt-card"><div class="apt-t">${esc(c.t)}</div><div class="apt-f">${esc(c.f)}</div>${c.ex?`<div class="apt-ex">${esc(c.ex)}</div>`:''}</div>`).join('')}</div>`;}
function renderInterviewBank(key){const labels={java:'Java Interview Bank',dbms:'DBMS Interview Bank',os:'OS Interview Bank',cn:'Networks Interview Bank',dsa:'DSA Interview Bank'};const items=BANKS[key]||[];return `<div class="sec-h"><h2>${labels[key]}</h2><p>Answer aloud first. Open the card only to check yourself.</p></div>${items.map((q,i)=>`<div class="int-item" id="int-${key}-${i}"><div class="int-q" onclick="toggleInt('${key}','${i}')"><span>${esc(q.q)}</span><span class="int-chev">▶</span></div><div class="int-bd"><div class="int-f"><div class="int-f-l">Ideal Answer</div><div class="int-f-v">${esc(q.a)}</div></div><div class="int-fu">↳ Follow-up: ${esc(q.fu)}</div><div class="int-trap">⚠ Trap: ${esc(q.trap)}</div></div></div>`).join('')}`;}
function toggleInt(key,i){const el=document.getElementById('int-'+key+'-'+i);if(el)el.classList.toggle('open');}
function renderHR(){return `<div class="sec-h"><h2>HR / Behavioral</h2><p>Use these as scaffolds, then swap in your real experiences.</p></div><div class="star-card"><div class="star-t">STAR = Situation → Task → Action → Result</div><div class="star-grid"><div class="star-blk s"><div class="l">Situation</div><div class="v">Context, 1–2 sentences.</div></div><div class="star-blk t"><div class="l">Task</div><div class="v">Your responsibility.</div></div><div class="star-blk a"><div class="l">Action</div><div class="v">What YOU did.</div></div><div class="star-blk r"><div class="l">Result</div><div class="v">Outcome + learning.</div></div></div></div>${STAR_STORIES.map(s=>`<div class="star-card"><div class="star-t">“${esc(s.q)}”</div><div class="star-grid"><div class="star-blk s"><div class="l">S</div><div class="v">${esc(s.s)}</div></div><div class="star-blk t"><div class="l">T</div><div class="v">${esc(s.t)}</div></div><div class="star-blk a"><div class="l">A</div><div class="v">${esc(s.a)}</div></div><div class="star-blk r"><div class="l">R</div><div class="v">${esc(s.r)}</div></div></div></div>`).join('')}`;}
function renderMockSetup(){return `<div class="mock-setup"><h2>Full Mock Interview</h2><p>Run a mixed technical test, review mistakes, then switch to project/HR defense.</p><div class="mock-opts"><button class="mock-ob${State.mockCount===20?' sel':''}" onclick="setMockCount(20,this)">20 Q / 20 min</button><button class="mock-ob${State.mockCount===30?' sel':''}" onclick="setMockCount(30,this)">30 Q / 30 min</button><button class="mock-ob${State.mockCount===60?' sel':''}" onclick="setMockCount(60,this)">60 Q / 60 min</button></div><button class="btn btn-g" style="margin-top:12px" onclick="startMock()">Start Test</button></div><div class="mock-run" id="mock-run"><div class="mock-hd"><div id="mock-prog" class="mock-prog"></div><div class="mock-timer" id="mock-timer">00:00</div></div><div id="mock-qc"></div><div class="mock-nav" id="mock-nav"></div></div><div class="mock-res" id="mock-res"></div>`;}
function setMockCount(n,el){State.mockCount=n;document.querySelectorAll('.mock-ob').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');}
function startMock(){const shuffled=[...MCQ].sort(()=>Math.random()-.5).slice(0,Math.min(State.mockCount,MCQ.length));State.mockQ=shuffled;State.mockCur=0;State.mockAns={};State.mockSec=State.mockCount*60;clearInterval(State.mockTimer);document.getElementById('mock-run').classList.add('show');document.querySelector('.mock-setup').style.display='none';State.mockTimer=setInterval(()=>{State.mockSec--;const el=document.getElementById('mock-timer');if(el)el.textContent=fmtTime(State.mockSec);if(State.mockSec<=0){clearInterval(State.mockTimer);finishMock();}},1000);renderMockQ();}
function renderMockQ(){const q=State.mockQ[State.mockCur];if(!q)return;const ans=State.mockAns[State.mockCur],answered=ans!==undefined;document.getElementById('mock-prog').textContent=`Question ${State.mockCur+1} of ${State.mockQ.length}`;document.getElementById('mock-qc').innerHTML=`<div class="mock-qc"><div class="mock-qm"><span class="mock-qt">${esc(q.topic)}</span><span class="mock-qd">${esc(q.diff)}</span></div><div class="mock-question">${esc(q.q)}</div><div class="mock-options">${q.opts.map((o,i)=>`<button class="mock-opt${answered?(i===q.correct?' correct':i===ans?' wrong':''):''}" ${answered?'disabled':''} onclick="answerMock(${i})">${esc(String.fromCharCode(65+i))}. ${esc(o)}</button>`).join('')}</div><div class="mock-exp${answered?' show':''}">${esc(q.exp)}</div></div>`;document.getElementById('mock-nav').innerHTML=`${State.mockCur>0?'<button class="btn" onclick="prevMockQ()">← Prev</button>':''}${State.mockCur<State.mockQ.length-1?'<button class="btn btn-g" onclick="nextMockQ()">Next →</button>':''}<button class="btn btn-r" onclick="finishMock()">Finish Test</button>`;}
function answerMock(i){if(State.mockAns[State.mockCur]!==undefined)return;const q=State.mockQ[State.mockCur];State.mockAns[State.mockCur]=i;if(i!==q.correct)Store.addMistake({qid:q.id,question:q.q,chosen:q.opts[i],correct:q.opts[q.correct],exp:q.exp,topic:q.topic});renderMockQ();}
function nextMockQ(){if(State.mockCur<State.mockQ.length-1){State.mockCur++;renderMockQ();}}function prevMockQ(){if(State.mockCur>0){State.mockCur--;renderMockQ();}}
function finishMock(){clearInterval(State.mockTimer);const total=State.mockQ.length;const correct=Object.entries(State.mockAns).filter(([i,a])=>a===State.mockQ[i]?.correct).length;const answered=Object.keys(State.mockAns).length;const timeTaken=State.mockCount*60-State.mockSec;Store.addSession({date:Date.now(),durationMin:Math.round(timeTaken/60),topicsStudied:0,patternsVisited:0,mockScore:`${correct}/${total}`});document.getElementById('mock-run').classList.remove('show');document.getElementById('mock-res').classList.add('show');document.getElementById('mock-res').innerHTML=`<div class="res-hd"><div class="res-score">${correct}/${total}</div><div class="res-lbl">${Math.round(correct/total*100)}% correct · ${fmtTime(timeTaken)} taken</div><div class="res-grid"><div class="res-stat"><div class="n">${correct}</div><div class="l">Correct</div></div><div class="res-stat"><div class="n" style="color:var(--red)">${answered-correct}</div><div class="l">Wrong</div></div><div class="res-stat"><div class="n" style="color:var(--muted)">${total-answered}</div><div class="l">Skipped</div></div></div></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn btn-g" onclick="navigate('mock')">New Test</button><button class="btn" onclick="navigate('mistakes')">Review Mistakes (${Store.d.mockMistakes.length})</button></div>`;}
function renderMistakes(){const ms=Store.d.mockMistakes;return `<div class="sec-h"><h2>Mistake Review</h2><p>${ms.length} questions logged from previous mocks.</p></div>${ms.length?`<button class="btn btn-r" style="margin-bottom:12px" onclick="clearMistakes()">Clear All Mistakes</button>${ms.slice().reverse().map(m=>`<div class="mis-item"><div class="mis-q">${esc(m.question)}</div><div class="mis-ch">✗ You answered: ${esc(m.chosen)}</div><div class="mis-co">✓ Correct: ${esc(m.correct)}</div><div class="mis-ex">${esc(m.exp)}</div></div>`).join('')}`:'<div class="empty">No mistakes logged yet. Start a mock.</div>'}`;}
function clearMistakes(){Store.clearMistakes();navigate('mistakes');}
function renderQuickRev(){return `<div class="sec-h"><h2>Quick Revision</h2><p>Use this the day of the interview, not as your first exposure to the topic.</p></div>${Object.entries(QR).map(([k,arr])=>`<div class="qr-sec"><div class="qr-sec-t">${esc(k)}</div><div class="qr-grid">${arr.map(c=>`<div class="qr-card"><div class="qr-t">${esc(c.t)}</div><div class="qr-b">${esc(c.b)}</div><div class="qr-trap">⚠ ${esc(c.trap)}</div></div>`).join('')}</div></div>`).join('')}`;}
function renderFocus(){return `<div class="focus-setup" id="focus-setup"><h2>Focus Session</h2><p>Study one track step at a time.</p><div class="dur-opts">${[30,60,90,120,240].map(m=>`<button class="dur-btn${State.focusDur===m?' sel':''}" onclick="setDuration(${m},this)"><div class="dm">${m}</div><div>min</div></button>`).join('')}</div><button class="btn btn-g" onclick="startFocus()">Start Focus Session</button></div><div class="focus-active" id="focus-active"><div class="focus-disp"><div class="focus-time" id="focus-time">00:00</div><div class="focus-sub">Elapsed · ${State.focusDur} min session</div></div><div class="focus-stats"><div class="focus-stat"><div class="n" id="fst-topics">0</div><div class="l">Topics visited</div></div><div class="focus-stat"><div class="n" id="fst-patterns">0</div><div class="l">Patterns seen</div></div><div class="focus-stat"><div class="n" id="fst-remain">--:--</div><div class="l">Remaining</div></div></div><div style="display:flex;gap:7px"><button class="btn" id="pause-btn" onclick="pauseFocus()">Pause</button><button class="btn btn-r" onclick="endFocus()">End Session</button></div></div>`;}
function setDuration(m,el){State.focusDur=m;document.querySelectorAll('.dur-btn').forEach(b=>b.classList.remove('sel'));el.classList.add('sel');}
function startFocus(){State.focusElapsed=0;State.focusRunning=true;State.focusTopics=0;State.focusPatterns=0;document.getElementById('focus-setup').style.display='none';document.getElementById('focus-active').classList.add('show');clearInterval(State.focusTimer);State.focusTimer=setInterval(()=>{if(!State.focusRunning)return;State.focusElapsed++;const remain=State.focusDur*60-State.focusElapsed;const el=document.getElementById('focus-time');if(el)el.textContent=fmtTime(State.focusElapsed);const rel=document.getElementById('fst-remain');if(rel)rel.textContent=remain>0?fmtTime(remain):'Done!';if(remain<=0){clearInterval(State.focusTimer);toast('Session complete!');endFocus();}},1000);}
function pauseFocus(){State.focusRunning=!State.focusRunning;const btn=document.getElementById('pause-btn');if(btn)btn.textContent=State.focusRunning?'Pause':'Resume';}
function endFocus(){clearInterval(State.focusTimer);State.focusRunning=false;Store.addSession({date:Date.now(),durationMin:Math.round(State.focusElapsed/60),topicsStudied:State.focusTopics,patternsVisited:State.focusPatterns,mockScore:null});toast('Session saved');navigate('history');}
function renderHistory(){const ss=Store.d.sessions.slice().reverse();return `<div class="sec-h"><h2>Session History</h2><p>${ss.length} sessions recorded.</p></div>${ss.length?ss.map(s=>`<div class="hist-item"><div class="hist-date">${fmtDate(s.date)}</div><div><div class="hist-dur">${s.durationMin} min</div><div class="hist-det">${s.topicsStudied?`${s.topicsStudied} topics · `:''}${s.patternsVisited?`${s.patternsVisited} patterns · `:''}${s.mockScore?`Mock: ${s.mockScore}`:''}</div></div></div>`).join(''):'<div class="empty">No sessions yet.</div>'}`;}
function renderSearch(q){const ql=q.toLowerCase().trim();if(!ql)return '<div class="empty">Type to search.</div>';const results=[];Object.entries(TOPICS).forEach(([sec,ts])=>ts.forEach(t=>{const hay=[t.title,t.sub,t.what,t.why,t.how,t.trap,t.remember,t.interview].join(' ').toLowerCase();if(hay.includes(ql))results.push({type:'topic',sec,id:t.id,title:t.title,snip:t.sub||t.what||''});}));Object.entries(PROJECTS).forEach(([key,p])=>{if([p.name,p.stack,p.problem,p.arch,...p.questions].join(' ').toLowerCase().includes(ql))results.push({type:'project',id:key,title:p.name,snip:p.stack});});SPRING.forEach((x,i)=>{if(x.join(' ').toLowerCase().includes(ql))results.push({type:'spring',title:x[0],snip:x[1]});});Object.entries(BANKS).forEach(([key,items])=>items.forEach((x,i)=>{if((x.q+' '+x.a+' '+x.fu).toLowerCase().includes(ql))results.push({type:'bank',key,i,title:x.q,snip:x.a.slice(0,90)+'…'});}));PATTERNS.forEach(p=>{if([p.name,p.recognize,p.idea,p.trap].join(' ').toLowerCase().includes(ql))results.push({type:'pattern',title:p.name,snip:p.recognize});});return `<div class="sec-h"><h2>Search Results</h2><p>${results.length} matches for “${esc(q)}”</p></div>${results.length?results.slice(0,40).map(r=>`<div class="sr-item" onclick="${r.type==='topic'?\`navigate('${r.sec}');setTimeout(()=>toggleTopic('${r.id}'),0)\`:r.type==='project'?\`navigate('${r.id}')\`:r.type==='spring'?\`navigate('spring')\`:r.type==='bank'?\`navigate('${r.key}-int');setTimeout(()=>toggleInt('${r.key}','${r.i}'),0)\`:'navigate(\\'patterns\\')'}"><div class="sr-sec">${esc(r.type)}</div><div class="sr-title">${esc(r.title)}</div><div class="sr-snip">${esc(r.snip)}</div></div>`).join(''):'<div class="empty">No results. Try “HashMap”, “REST”, “JWT”, “AWS”, “401”, or “normalization”.</div>'}`;}
function bindEvents(){
 document.getElementById('menuBtn').onclick=()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show');};
 document.getElementById('overlay').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');};
 const doSearch=q=>{State.query=q;if(q)document.getElementById('curSec').textContent='Search';else document.getElementById('curSec').textContent=SECTIONS.flatMap(g=>g.items).find(i=>i.id===State.section)?.label||State.section;renderMain();};
 document.getElementById('sbSearch').oninput=e=>{document.getElementById('topSearch').value=e.target.value;doSearch(e.target.value);};
 document.getElementById('topSearch').oninput=e=>{document.getElementById('sbSearch').value=e.target.value;doSearch(e.target.value);};
 document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('topSearch').focus();}});
 document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset ALL progress? This cannot be undone.')){Store.reset();Store.load();renderSidebar();renderMain();toast('Progress reset.');}};
}
Store.migrate();Store.load();renderSidebar();navigate('mphasis');bindEvents();
</script>
</body>
</html>
