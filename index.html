<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PrepMate — CS Interview OS</title>
<style>
:root{
  --bg:#0b0d0f;--surface:#111418;--s2:#171b20;--border:#242a31;
  --text:#f0f3f6;--muted:#8b949e;--green:#3fb950;--yellow:#d29922;
  --red:#f85149;--blue:#58a6ff;--purple:#bc8cff;
  --mono:'Cascadia Code','Fira Code',ui-monospace,SFMono-Regular,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;--r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:14px}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;min-height:100vh}
button{cursor:pointer;font:inherit;background:none;border:none}
input,select,textarea{font:inherit}a{color:inherit;text-decoration:none}
::selection{background:#3fb95033}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
/* SIDEBAR */
.sidebar{width:240px;height:100vh;position:sticky;top:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:30}
.sb-inner{flex:1;overflow-y:auto;padding-bottom:60px}
.brand{padding:14px 12px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.brand-logo{width:26px;height:26px;background:var(--green);border-radius:4px;display:grid;place-items:center;color:#000;font-weight:900;font-size:12px;flex-shrink:0}
.brand-name{font-size:12px;font-weight:700}.brand-sub{font-size:10px;color:var(--muted)}
.sb-search{padding:8px 10px 6px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-search input{width:100%;background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:var(--r);padding:5px 9px;font-size:12px;outline:none}
.sb-search input:focus{border-color:var(--blue)}.sb-search input::placeholder{color:var(--muted)}
.nav-grp{padding:12px 8px 2px}.nav-grp-lbl{font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding:0 4px 5px}
.nav-item{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;border-radius:var(--r);font-size:12px;color:var(--muted);cursor:pointer;width:100%;text-align:left;gap:4px;border:none;background:none}
.nav-item:hover{background:var(--s2);color:var(--text)}.nav-item.active{background:var(--s2);color:var(--text);font-weight:600}
.nav-cnt{font-size:9px;color:var(--muted);background:var(--border);padding:1px 5px;border-radius:3px;flex-shrink:0;font-family:var(--mono)}
.nav-item.active .nav-cnt{color:var(--green)}
.sb-prog{padding:10px 12px;border-top:1px solid var(--border);flex-shrink:0;background:var(--surface)}
.sb-prog-lbl{font-size:10px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between}
.pb{height:3px;background:var(--border);border-radius:3px;overflow:hidden}
.pb-fill{height:100%;background:var(--green);border-radius:3px;transition:width .3s}
/* MAIN */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:8px;min-height:46px}
.topbar-l{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.topbar-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cur-sec{font-size:12px;font-weight:600}
.top-search{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:4px 9px;color:var(--text);font-size:12px;outline:none;width:180px}
.top-search:focus{border-color:var(--blue)}.top-search::placeholder{color:var(--muted)}
.btn{padding:4px 10px;border-radius:var(--r);border:1px solid var(--border);font-size:12px;color:var(--muted);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--text);color:var(--text)}
.btn-g{background:var(--green);color:#000;border-color:var(--green);font-weight:600}
.btn-g:hover{background:#4dc95f;color:#000}
.btn-r{color:var(--red)}.btn-r:hover{border-color:var(--red)}
.btn-icon{width:28px;height:28px;padding:0;display:grid;place-items:center}
.mob-menu{display:none}
.overlay{display:none;position:fixed;inset:0;background:#000a;z-index:25}
.overlay.show{display:block}
/* CONTENT */
.content{padding:18px 20px;max-width:980px;width:100%;margin:0 auto}
/* DASHBOARD */
.pg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:7px;margin-bottom:16px}
.pg-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px}
.pg-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.pg-pct{font-size:20px;font-weight:700;font-family:var(--mono);margin-bottom:4px}
.pg-bar{height:2px;background:var(--border);border-radius:2px;overflow:hidden}
.pg-fill{height:100%;background:var(--green)}
.pg-sub{font-size:10px;color:var(--muted);margin-top:3px}
.sec-h{margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.sec-h h2{font-size:14px;font-weight:700}.sec-h p{font-size:11px;color:var(--muted);margin-top:2px}
.weak-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.weak-item{display:flex;align-items:center;gap:7px;padding:6px 9px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:5px;cursor:pointer;font-size:11px}
.weak-item:hover{border-color:var(--yellow)}.weak-dot{width:5px;height:5px;border-radius:50%;background:var(--yellow);flex-shrink:0}
.dash-actions{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
/* TOPIC CARDS */
.topic-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:7px;overflow:hidden}
.topic-hd{padding:10px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;cursor:pointer;user-select:none}
.topic-hd:hover{background:var(--s2)}.topic-tr{flex:1;min-width:0}
.topic-title{font-size:13px;font-weight:600;margin-bottom:1px}.topic-sub{font-size:11px;color:var(--muted)}
.topic-meta{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:9px;padding:2px 5px;border-radius:3px;border:1px solid var(--border);color:var(--muted)}
.tag-trap{border-color:#f8514944;background:#f8514910;color:var(--red)}
.tag-hot{border-color:#3fb95044;background:#3fb95010;color:var(--green)}
.tag-blue{border-color:#58a6ff44;background:#58a6ff10;color:var(--blue)}
.sbadge{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:600;border:1px solid;flex-shrink:0;white-space:nowrap}
.s-ns{border-color:var(--border);color:var(--muted)}
.s-l{border-color:#d2992244;background:#d2992210;color:var(--yellow)}
.s-r{border-color:#58a6ff44;background:#58a6ff10;color:var(--blue)}
.s-m{border-color:#3fb95044;background:#3fb95010;color:var(--green)}
.topic-bd{display:none;padding:0 12px 12px;border-top:1px solid var(--border)}
.topic-bd.open{display:block}
.t-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.t-blk{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:9px}
.t-blk-full{grid-column:1/-1}
.blk-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.blk-val{font-size:12px;line-height:1.65;color:var(--text)}
.blk-trap{border-left:2px solid var(--red);background:#f8514908}
.blk-trap .blk-lbl{color:var(--red)}
.blk-rem{border-left:2px solid var(--green);background:#3fb95008}
.blk-rem .blk-lbl{color:var(--green)}
.blk-int{border-left:2px solid var(--blue);background:#58a6ff08}
.blk-int .blk-lbl{color:var(--blue)}
pre{background:#0d1117;border:1px solid var(--border);border-radius:var(--r);padding:11px;overflow-x:auto;font:11.5px/1.65 var(--mono);margin-top:7px}
.diagram{font:11.5px/1.5 var(--mono);background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:9px;white-space:pre;overflow-x:auto;color:var(--muted);margin-top:7px}
.t-acts{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.checks{margin-top:9px}
.check-item{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:7px 9px;margin-bottom:4px;cursor:pointer}
.check-q{font-size:11px}
.check-a{font-size:11px;color:var(--green);display:none;margin-top:4px;padding-top:4px;border-top:1px solid var(--border)}
.check-item.rev .check-a{display:block}
/* PATTERNS */
.pat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px}
.pat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.pat-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.pat-name{font-size:12px;font-weight:600}.pat-cx{font-size:10px;font-family:var(--mono);color:var(--yellow)}
.pat-fl{margin-bottom:5px}
.pat-fl-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.pat-fl-v{font-size:11px}
.pat-probs{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.prob-tag{font-size:10px;padding:2px 6px;border-radius:3px;border:1px solid var(--border);color:var(--blue)}
.solved-cb{width:20px;height:20px;border:1px solid var(--border);border-radius:3px;display:grid;place-items:center;cursor:pointer;font-size:11px;color:var(--muted);flex-shrink:0}
.solved-cb.done{background:var(--green);border-color:var(--green);color:#000;font-weight:700}
/* APTITUDE */
.apt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.apt-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px}
.apt-t{font-size:11px;font-weight:600;margin-bottom:6px;color:var(--blue)}
.apt-f{font:11px/1.7 var(--mono);background:var(--s2);border-radius:4px;padding:7px;border:1px solid var(--border);margin-bottom:5px;white-space:pre-wrap}
.apt-ex{font-size:11px;color:var(--muted);border-left:2px solid var(--border);padding-left:7px;line-height:1.6}
/* INTERVIEW BANKS */
.int-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px;overflow:hidden}
.int-q{padding:10px 12px;cursor:pointer;font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.int-q:hover{background:var(--s2)}
.int-chev{color:var(--muted);font-size:10px;flex-shrink:0;transition:transform .15s;margin-top:2px}
.int-item.open .int-chev{transform:rotate(90deg)}
.int-bd{display:none;padding:0 12px 11px;border-top:1px solid var(--border)}
.int-item.open .int-bd{display:block}
.int-f{margin-top:8px}
.int-f-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.int-f-v{font-size:12px;line-height:1.65}
.int-trap{color:var(--red);font-size:11px;margin-top:5px}
.int-fu{color:var(--blue);font-size:11px;font-style:italic;margin-top:3px}
/* PROJECT */
.proj-ed{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.proj-ed h3{font-size:13px;font-weight:600;margin-bottom:11px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ff{display:flex;flex-direction:column;gap:3px}.ff.full{grid-column:1/-1}
.fl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fi{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:7px 9px;color:var(--text);font-size:12px;outline:none;resize:vertical;min-height:56px}
.fi:focus{border-color:var(--blue)}
input.fi{min-height:auto;height:32px;resize:none}
.pitch-out{background:#0d1117;border:1px solid var(--border);border-radius:var(--r);padding:12px;font-size:12px;line-height:1.8;white-space:pre-wrap;margin-top:10px;display:none}
.pitch-out.show{display:block}
/* MOCK */
.mock-setup{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:16px}
.mock-setup h2{font-size:14px;font-weight:700;margin-bottom:5px}
.mock-setup p{font-size:12px;color:var(--muted);margin-bottom:14px}
.mock-opts{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.mock-ob{padding:7px 14px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;color:var(--muted);cursor:pointer;background:var(--s2)}
.mock-ob:hover,.mock-ob.sel{border-color:var(--blue);color:var(--blue)}
.mock-run{display:none}.mock-run.show{display:block}
.mock-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.mock-timer{font-size:17px;font-weight:700;font-family:var(--mono);color:var(--yellow)}
.mock-prog{font-size:12px;color:var(--muted)}
.mock-qc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.mock-qm{display:flex;gap:7px;margin-bottom:8px}
.mock-qt{font-size:10px;color:var(--blue);font-family:var(--mono)}.mock-qd{font-size:10px;color:var(--muted)}
.mock-question{font-size:13px;font-weight:500;line-height:1.55;margin-bottom:12px}
.mock-options{display:grid;gap:5px}
.mock-opt{padding:9px 11px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;cursor:pointer;background:var(--s2);text-align:left;width:100%}
.mock-opt:hover:not([disabled]){border-color:var(--blue);color:var(--blue)}
.mock-opt.correct{border-color:var(--green);background:#3fb95015;color:var(--green)}
.mock-opt.wrong{border-color:var(--red);background:#f8514915;color:var(--red)}
.mock-opt.show-c{border-color:var(--green);background:#3fb95015;color:var(--green)}
.mock-exp{margin-top:9px;padding:9px;background:var(--s2);border-radius:var(--r);font-size:11px;color:var(--muted);line-height:1.6;border-left:2px solid var(--blue);display:none}
.mock-exp.show{display:block}
.mock-nav{display:flex;gap:6px;margin-top:10px}
.mock-res{display:none}.mock-res.show{display:block}
.res-hd{text-align:center;padding:22px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:14px}
.res-score{font-size:34px;font-weight:700;font-family:var(--mono);margin-bottom:3px}
.res-lbl{font-size:12px;color:var(--muted)}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.res-stat{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:10px;text-align:center}
.res-stat .n{font-size:18px;font-weight:700;font-family:var(--mono)}.res-stat .l{font-size:10px;color:var(--muted);margin-top:2px}
/* QUICK REV */
.qr-sec{margin-bottom:20px}
.qr-sec-t{font-size:10px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:5px}
.qr-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:9px}
.qr-t{font-size:11px;font-weight:600;margin-bottom:3px}
.qr-b{font-size:11px;color:var(--muted);line-height:1.6}
.qr-b code{font-family:var(--mono);font-size:10px;color:var(--blue);background:var(--s2);padding:1px 3px;border-radius:2px}
.qr-trap{font-size:10px;color:var(--red);margin-top:4px;padding-top:4px;border-top:1px solid var(--border)}
/* FOCUS TIMER */
.focus-setup{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;text-align:center;max-width:460px;margin:0 auto}
.focus-setup h2{font-size:14px;font-weight:700;margin-bottom:5px}
.focus-setup p{font-size:12px;color:var(--muted);margin-bottom:18px}
.dur-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.dur-btn{padding:9px 6px;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;font-size:11px;color:var(--muted);background:var(--s2);display:flex;flex-direction:column;align-items:center;gap:2px}
.dur-btn:hover,.dur-btn.sel{border-color:var(--blue);color:var(--blue)}
.dur-btn .dm{font-size:17px;font-weight:700;font-family:var(--mono);color:var(--text)}
.dur-btn.sel .dm{color:var(--blue)}
.focus-active{display:none}.focus-active.show{display:block}
.focus-disp{text-align:center;padding:28px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px}
.focus-time{font-size:52px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em;margin-bottom:6px}
.focus-sub{font-size:12px;color:var(--muted)}
.focus-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.focus-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:9px;text-align:center}
.focus-stat .n{font-size:17px;font-weight:700;font-family:var(--mono)}.focus-stat .l{font-size:10px;color:var(--muted)}
/* MISTAKES */
.mis-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px;margin-bottom:6px}
.mis-q{font-size:12px;font-weight:500;margin-bottom:5px}.mis-ch{font-size:11px;color:var(--red);margin-bottom:2px}
.mis-co{font-size:11px;color:var(--green);margin-bottom:5px}
.mis-ex{font-size:11px;color:var(--muted);border-top:1px solid var(--border);padding-top:6px;margin-top:6px;line-height:1.6}
/* HISTORY */
.hist-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px;margin-bottom:5px;display:flex;gap:12px}
.hist-date{font-size:10px;font-family:var(--mono);color:var(--muted);min-width:100px}
.hist-dur{font-size:13px;font-weight:600;font-family:var(--mono);margin-bottom:2px}
.hist-det{font-size:11px;color:var(--muted)}
/* SEARCH */
.sr-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;margin-bottom:5px;cursor:pointer}
.sr-item:hover{border-color:var(--blue)}
.sr-sec{font-size:10px;color:var(--muted);font-family:var(--mono);margin-bottom:2px}
.sr-title{font-size:13px;font-weight:600;margin-bottom:2px}.sr-snip{font-size:11px;color:var(--muted)}
/* STAR/HR */
.star-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:13px;margin-bottom:7px}
.star-t{font-size:12px;font-weight:600;margin-bottom:7px}
.star-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.star-blk{background:var(--s2);border-radius:4px;padding:7px;border-left:2px solid var(--border)}
.star-blk.s{border-color:var(--blue)}.star-blk.t{border-color:var(--yellow)}.star-blk.a{border-color:var(--green)}.star-blk.r{border-color:var(--purple)}
.star-blk .l{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.star-blk .v{font-size:11px;line-height:1.5}
/* TOAST */
.toast{position:fixed;bottom:18px;right:18px;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:9px 13px;font-size:12px;z-index:100;opacity:0;transform:translateY(5px);pointer-events:none;transition:opacity .15s,transform .15s}
.toast.show{opacity:1;transform:none}
.empty{padding:36px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--border);border-radius:var(--r)}
/* RESPONSIVE */
@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;width:240px}
  .sidebar.open{transform:none}.mob-menu{display:grid}
  .top-search{width:130px}.content{padding:12px 14px}
  .t-grid{grid-template-columns:1fr}.fg{grid-template-columns:1fr}
  .res-grid{grid-template-columns:1fr 1fr}.star-grid{grid-template-columns:1fr 1fr}
  .pg-grid{grid-template-columns:repeat(2,1fr)}.pat-grid{grid-template-columns:1fr}
  .focus-time{font-size:40px}.dur-opts{grid-template-columns:repeat(2,1fr)}
}

const TOPICS={
java:[
{id:'jdk',title:'JDK vs JRE vs JVM',sub:'Java runtime stack and bytecode portability',tags:['Most Asked'],
what:'JDK = development toolkit (includes javac compiler). JRE = runtime environment (JVM + standard libraries). JVM = virtual machine that executes bytecode.',
why:'Platform independence — Java compiles to bytecode (not native code), and any machine with a JVM can run it.',
how:'Source (.java) → javac → bytecode (.class) → JVM loads + verifies → JIT compiles hot code → CPU executes.',
example:'javac Hello.java → Hello.class (bytecode). That .class runs unchanged on Windows, Linux, or Mac.',
diagram:'JDK\n├─ javac (compiler)\n└─ JRE\n   ├─ JVM (Class Loader → Verifier → JIT → GC)\n   └─ Core Libraries (java.lang, java.util...)',
interview:'Is the JVM platform-independent?',
trap:'JVM is NOT platform-independent — each OS has its own JVM binary. BYTECODE is portable, not the JVM.',
remember:'"Write once, run anywhere" = bytecode portability. JVM itself is OS-specific.',
checks:[{q:'What does javac produce?',a:'Bytecode (.class files), not native machine code.'},{q:'Which component includes javac?',a:'JDK (Java Development Kit).'},{q:'Can a program run with only JRE installed?',a:'Yes — JRE contains the JVM needed to run .class files. JDK is only needed for development.'}]},

{id:'stack-heap',title:'Stack vs Heap Memory',sub:'Where local variables and objects actually live',tags:['Most Asked','Trap'],
what:'Stack = per-thread memory for method frames, local variables, references. Heap = shared memory for all objects, managed by GC.',
why:'Stack enables fast LIFO allocation for function calls. Heap supports dynamic object creation of any size.',
how:'Each method call creates a stack frame (local vars, return address). Objects are heap-allocated; the stack holds references (pointers) to them.',
example:'int x=5 → value 5 stored on stack. String s="hi" → reference on stack, String object on heap.',
trap:'StackOverflowError = too many recursive calls (stack full). OutOfMemoryError = heap full. These are different problems.',
interview:'Where are local variables stored vs objects?',
remember:'Primitives and references live on stack. Objects live on heap.',
checks:[{q:'Where is a new ArrayList stored?',a:'Object lives on heap; the reference variable lives on stack.'},{q:'What causes StackOverflowError?',a:'Infinite or very deep recursion exhausting the call stack.'},{q:'Is heap or stack faster to allocate?',a:'Stack (simple pointer increment). Heap involves GC bookkeeping.'}]},

{id:'string-pool',title:'String, == vs equals(), String Pool',sub:'The classic Java trap interviewers always ask',tags:['Most Asked','Trap'],
what:'String pool = JVM cache for string literals. == compares references (addresses). equals() compares content.',
why:'Strings are immutable, so JVM can safely reuse literal objects via intern pool — saves memory.',
how:'"hello" == "hello" → true (same pooled object). new String("hello") == "hello" → false (new heap object). "hello".equals(new String("hello")) → true.',
code:'String a = "java";\nString b = "java";\nString c = new String("java");\nSystem.out.println(a == b);       // true (same pool object)\nSystem.out.println(a == c);       // false (c is new heap object)\nSystem.out.println(a.equals(c));  // true (same content)',
trap:'new String("x") bypasses the pool and creates a new heap object. == on this returns false even if content matches.',
interview:'Why does new String("hello") == "hello" return false?',
remember:'== checks "same object". equals() checks "same content". Always use equals() for strings.',
checks:[{q:'System.out.println("a"=="a") prints?',a:'true — both reference the same string pool object.'},{q:'When should you use intern()?',a:'To put a new String into the pool, making future == comparisons with literals work.'},{q:'Why are Strings immutable?',a:'Thread safety, safe HashMap keys, string pool optimization, security (ClassLoader uses strings).'}]},

{id:'stringbuilder',title:'StringBuilder vs StringBuffer',sub:'Mutable string builders and when to use each',tags:['Often Asked'],
what:'StringBuilder = mutable, NOT thread-safe, fast. StringBuffer = mutable, thread-safe (synchronized), slower.',
why:'String concatenation in a loop creates O(n) temporary objects. Builders modify a char array in-place — O(1) per append.',
how:'Both use an internal resizable char[]. append() adds to the buffer. toString() creates the final immutable String.',
code:'// Bad: O(n) Strings created\nString s = "";\nfor(int i=0;i<1000;i++) s += i;\n\n// Good: O(1) amortized\nStringBuilder sb = new StringBuilder();\nfor(int i=0;i<1000;i++) sb.append(i);\nString result = sb.toString();',
trap:'Using String + inside a loop is O(n²) due to repeated object creation. Always prefer StringBuilder.',
interview:'Why is "s += x" in a loop bad for performance?',
remember:'StringBuilder = single-threaded, fast. StringBuffer = multi-threaded, synchronized.',
checks:[{q:'Which is faster — StringBuilder or StringBuffer?',a:'StringBuilder, because it has no synchronization overhead.'},{q:'What is the complexity of StringBuilder.append()?',a:'O(1) amortized (occasional array resize, but spread across appends).'}]},

{id:'oop',title:'OOP — 4 Pillars',sub:'Encapsulation, Inheritance, Polymorphism, Abstraction',tags:['Most Asked'],
what:'Encapsulation = hide state behind methods. Inheritance = share behavior (is-a). Polymorphism = one interface, many implementations. Abstraction = hide complexity.',
why:'Each pillar solves a distinct design problem: Encap controls access, Inheritance enables reuse, Poly enables flexibility, Abstract simplifies interfaces.',
how:'Encap: private fields + public getters/setters. Inherit: extends (one parent only). Poly: overriding + interfaces. Abstract: abstract class or interface.',
code:'interface Shape { void draw(); }\nclass Circle implements Shape {\n  private int r;          // Encapsulation\n  public void draw(){     // Polymorphism\n    System.out.println("Circle r="+r);\n  }\n}',
trap:'Abstraction ≠ Encapsulation. Abstraction hides WHAT (complexity). Encapsulation hides HOW (data access). Many confuse the two.',
interview:'Explain polymorphism with a concrete example.',
remember:'Encap=hide data. Inherit=share code. Poly=same call, different behavior. Abstract=hide complexity.',
checks:[{q:'Can a class extend more than one class in Java?',a:'No. Java allows single inheritance for classes. Use interfaces for multiple.'},{q:'What is runtime polymorphism?',a:'Method overriding — the actual method called is decided at runtime based on the object type.'},{q:'Difference between abstraction and encapsulation?',a:'Abstraction hides complexity (WHAT). Encapsulation hides internal data (HOW).'}]},

{id:'interface-abstract',title:'Interface vs Abstract Class',sub:'When to use each and Java 8+ changes',tags:['Most Asked'],
what:'Interface = pure contract (abstract methods + default/static since Java 8). Abstract class = partial implementation with abstract methods.',
why:'Interface enables multiple inheritance. Abstract class enables shared code with forced contracts.',
how:'A class implements multiple interfaces but extends only one abstract class. Interface fields are implicitly public static final.',
code:'interface Flyable { void fly(); default void land(){ System.out.println("landing"); } }\nabstract class Animal { abstract void speak(); void breathe(){ System.out.println("breathing"); } }\nclass Bird extends Animal implements Flyable {\n  public void speak(){ System.out.println("tweet"); }\n  public void fly(){ System.out.println("flying"); }\n}',
trap:'Since Java 8, interfaces CAN have concrete methods (default/static). "Interfaces have only abstract methods" is outdated.',
interview:'When would you choose an abstract class over an interface?',
remember:'Interface = contract, multiple allowed. Abstract class = partial impl, one parent, can have state.',
checks:[{q:'Can a Java class implement multiple interfaces?',a:'Yes.'},{q:'Can an interface have constructors?',a:'No. Interfaces cannot be instantiated.'},{q:'What changed in Java 8 for interfaces?',a:'Default methods and static methods were added, allowing concrete implementations.'}]},

{id:'overload-override',title:'Overloading vs Overriding',sub:'Compile-time vs runtime dispatch',tags:['Most Asked','Trap'],
what:'Overloading = same name, different parameter list, same class. Resolved at compile time. Overriding = same signature, different class (child overrides parent). Resolved at runtime.',
why:'Overloading = convenient API. Overriding = polymorphism and behavior customization.',
how:'Overloading: compiler picks the method based on parameter types. Overriding: JVM uses vtable to dispatch to the actual object type at runtime.',
code:'class Calc {\n  int add(int a, int b){ return a+b; }   // overloaded\n  double add(double a, double b){ return a+b; } // overloaded\n}\nclass Animal { void speak(){ System.out.println("..."); } }\nclass Dog extends Animal {\n  @Override void speak(){ System.out.println("Woof"); } // overriding\n}',
trap:'You CANNOT override static methods — they are "hidden" not overridden. Return type alone cannot distinguish overloaded methods.',
interview:'Can you override a static method in Java?',
remember:'Overload = compile time (different params). Override = runtime (same sig, child class, @Override).',
checks:[{q:'Which is compile-time polymorphism — overloading or overriding?',a:'Overloading.'},{q:'What annotation marks an overriding method?',a:'@Override (best practice to always include it).'},{q:'Can you overload a method by return type only?',a:'No — return type alone is not enough to distinguish overloaded methods.'}]},

{id:'exceptions',title:'Exception Handling — Checked vs Unchecked',sub:'Structured error propagation in Java',tags:['Most Asked'],
what:'Checked exceptions = compiler-enforced (IOException, SQLException). Unchecked = extend RuntimeException (NullPointerException, ArrayIndexOutOfBoundsException) — optional handling.',
why:'Checked forces callers to handle expected failures. Unchecked signals programming errors.',
how:'throw raises. throws declares. try/catch handles. finally always runs (cleanup). Try-with-resources auto-closes Closeable resources.',
code:'void read() throws IOException {          // checked — must declare\n  if(path==null)\n    throw new IllegalArgumentException("null path"); // unchecked\n  // ...\n}\n\ntry(BufferedReader br = new BufferedReader(new FileReader(path))){\n  return br.readLine();\n} // br closed automatically',
trap:'Never catch and silently ignore exceptions: catch(Exception e){} — this hides bugs permanently.',
interview:'When would you use a checked vs unchecked exception?',
remember:'Checked = recoverable expected failure (declare or catch). Unchecked = programmer error (optional).',
checks:[{q:'Does finally run if return is inside try?',a:'Yes, finally always runs before the method returns.'},{q:'What is try-with-resources?',a:'Auto-closes Closeable resources after the block — no explicit finally needed.'},{q:'Is NullPointerException checked or unchecked?',a:'Unchecked (RuntimeException).'}]},

{id:'collections',title:'Collections — ArrayList, LinkedList, HashMap, HashSet',sub:'Core data structures every Java interview tests',tags:['Most Asked'],
what:'ArrayList = dynamic array (fast random access, slow mid-insert). LinkedList = doubly linked (fast front/back ops). HashMap = hash table (O(1) avg key lookup). HashSet = unique elements using HashMap.',
why:'Different use cases need different performance tradeoffs.',
how:'ArrayList: O(1) get, O(n) insert at middle, O(1) amortized add at end. LinkedList: O(n) get, O(1) add/remove at known node. HashMap: hashCode → bucket, equals → key match. HashSet = HashMap with dummy values.',
code:'Map<String,Integer> freq = new HashMap<>();\nfor(String w : words)\n  freq.put(w, freq.getOrDefault(w,0)+1);\n\nList<Integer> list = new ArrayList<>(); // for indexed access\nDeque<Integer> queue = new LinkedList<>(); // for queue/deque ops',
trap:'Equal objects MUST have equal hashCodes. If you override equals(), ALWAYS override hashCode() too.',
interview:'How does HashMap handle collisions?',
remember:'hashCode → bucket. equals → confirm key. Same hashCode ≠ same key. Override both or neither.',
checks:[{q:'Which List is faster for random access?',a:'ArrayList — O(1) by index.'},{q:'What is the default initial capacity of HashMap?',a:'16, with load factor 0.75.'},{q:'Can HashMap have null keys?',a:'Yes — one null key is allowed. Hashtable does not allow null keys.'}]},

{id:'multithreading',title:'Multithreading — synchronized, volatile, Deadlock',sub:'Concurrency fundamentals for Java interviews',tags:['Most Asked','Trap'],
what:'Thread = lightweight execution unit sharing process heap. synchronized = mutual exclusion (one thread at a time). volatile = guarantees visibility across threads. Race condition = unprotected shared state.',
why:'Concurrent access to shared data causes unpredictable results without synchronization.',
how:'Thread lifecycle: NEW → RUNNABLE → RUNNING → BLOCKED/WAITING → TERMINATED. synchronized block/method = implicit mutex (monitor lock). volatile: ensures write is visible immediately to other threads (no CPU caching).',
code:'class Counter {\n  private volatile int count = 0;\n  public synchronized void increment() { count++; }\n  public int get() { return count; }\n}\n// Deadlock example:\n// T1 holds Lock1, waits Lock2\n// T2 holds Lock2, waits Lock1 → deadlock',
trap:'volatile does NOT guarantee atomicity. count++ (read-modify-write) is NOT atomic even on a volatile. Use AtomicInteger or synchronized.',
interview:'What is the difference between volatile and synchronized?',
remember:'synchronized = exclusive access. volatile = visibility. Neither is a substitute for the other.',
checks:[{q:'What is a race condition?',a:'Two threads read/modify shared data without synchronization, giving unpredictable results.'},{q:'How do you prevent deadlock?',a:'Consistent lock ordering — always acquire Lock A before Lock B, never reverse.'},{q:'Can volatile replace synchronized?',a:'No — volatile only ensures visibility, not atomicity of compound operations.'}]},
],

dbms:[
{id:'keys',title:'Database Keys — PK, FK, Candidate, Super',sub:'Keys enforce identity and relationships',tags:['Most Asked'],
what:'Primary Key = unique + NOT NULL, identifies each row. Foreign Key = references PK of another table. Candidate Key = minimal set of columns that uniquely identify a row. Super Key = any superset of a candidate key.',
why:'Keys enforce entity integrity (no duplicate rows) and referential integrity (FK values must exist in parent).',
how:'One table can have many candidate keys but ONE primary key. FK creates a parent-child relationship. Composite keys use multiple columns together.',
example:'Employee: emp_id (PK), email (candidate key), dept_id (FK → departments.id)',
trap:'A table can have MULTIPLE candidate keys, but exactly ONE primary key. Natural keys (email) vs surrogate keys (auto-increment ID) is a design choice.',
interview:'What is the difference between a candidate key and a primary key?',
remember:'PK = chosen candidate key (unique + not null). FK = references another PK. Candidate = could-be PK.',
checks:[{q:'Can a primary key contain NULL?',a:'No. Primary keys must be NOT NULL and unique.'},{q:'Can a foreign key be null?',a:'Yes, unless restricted by NOT NULL constraint.'},{q:'What is a composite key?',a:'A primary key made up of two or more columns together.'}]},

{id:'normalization',title:'Normalization — 1NF, 2NF, 3NF, BCNF',sub:'Eliminating redundancy and update anomalies',tags:['Most Asked'],
what:'Process of structuring tables to reduce redundancy and prevent insertion/update/deletion anomalies.',
why:'Duplicated data causes anomalies: updating one row creates inconsistency; deleting one row loses other info.',
how:'1NF: atomic values, no repeating groups. 2NF: 1NF + no partial dependency (non-key column must depend on the WHOLE composite key). 3NF: 2NF + no transitive dependency (non-key ≠ depends on non-key). BCNF: 3NF + every determinant is a super key.',
diagram:'Unnormalized\n  ↓ 1NF: Atomic values, no repeating groups\n  ↓ 2NF: Remove partial dependencies\n  ↓ 3NF: Remove transitive dependencies\n  ↓ BCNF: Every FD left side is a super key',
trap:'Normalization reduces redundancy but INCREASES joins. Read-heavy systems sometimes deliberately denormalize for performance.',
interview:'What is the difference between 2NF and 3NF?',
remember:'1NF=atomic. 2NF=no partial dep on composite PK. 3NF=no non-key depends on non-key.',
checks:[{q:'If emp_id → name, emp_id → dept_id, dept_id → dept_name, which NF is violated?',a:'3NF — dept_name transitively depends on emp_id via dept_id.'},{q:'Does normalization always improve query performance?',a:'No — it can require more joins, potentially slowing reads.'}]},

{id:'joins',title:'SQL Joins — INNER, LEFT, RIGHT, FULL',sub:'Combining related tables correctly',tags:['Most Asked'],
what:'INNER JOIN = matching rows only. LEFT JOIN = all left rows + matched right (NULL where no match). RIGHT JOIN = all right rows + matched left. FULL OUTER JOIN = all rows from both.',
why:'Normalized data is split across tables. Joins reconstruct meaningful views.',
how:'JOIN uses ON to specify the relationship. INNER eliminates non-matching. LEFT keeps all left rows regardless.',
code:'-- All students with their dept (students without dept excluded)\nSELECT s.name, d.dept_name\nFROM students s\nINNER JOIN departments d ON d.id = s.dept_id;\n\n-- All students, even without dept\nSELECT s.name, d.dept_name\nFROM students s\nLEFT JOIN departments d ON d.id = s.dept_id;\n\n-- Students NOT in any department\nSELECT s.name FROM students s\nLEFT JOIN departments d ON d.id = s.dept_id\nWHERE d.id IS NULL;',
trap:'Putting a WHERE filter on the right-table column in a LEFT JOIN turns it into an INNER JOIN. Put such filters in ON clause.',
interview:'How would you find rows in Table A with no match in Table B?',
remember:'LEFT JOIN + WHERE right.id IS NULL = "rows in left with no match."',
checks:[{q:'Which join returns rows only when both tables have a match?',a:'INNER JOIN.'},{q:'What is returned for unmatched rows in a LEFT JOIN?',a:'NULL for all right-table columns.'}]},

{id:'group-having',title:'GROUP BY, HAVING, WHERE, Aggregates',sub:'The most tested SQL mechanics in interviews',tags:['Most Asked','Trap'],
what:'GROUP BY groups rows. Aggregate functions (COUNT, SUM, AVG, MAX, MIN) compute per group. WHERE filters rows BEFORE grouping. HAVING filters groups AFTER aggregation.',
why:'Analytical queries need grouping and filtering at different stages of processing.',
how:'SQL execution order: FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.',
code:'-- Departments with more than 5 employees earning > 50k\nSELECT dept_id, COUNT(*) AS headcount\nFROM employees\nWHERE salary > 50000        -- row filter BEFORE grouping\nGROUP BY dept_id\nHAVING COUNT(*) > 5;        -- group filter AFTER aggregation\n\n-- Second highest salary\nSELECT MAX(salary) FROM employees\nWHERE salary < (SELECT MAX(salary) FROM employees);',
trap:'You CANNOT use aggregate functions in WHERE. They do not exist yet at that stage. This is a VERY common interview mistake.',
interview:'Write a query to find departments with more than 5 employees.',
remember:'WHERE = before group (no aggregates). HAVING = after group (aggregates OK).',
checks:[{q:'Can you use COUNT() in a WHERE clause?',a:'No — aggregate functions cannot be in WHERE. Use HAVING after GROUP BY.'},{q:'What is the difference between COUNT(*) and COUNT(col)?',a:'COUNT(*) counts all rows including NULLs. COUNT(col) excludes NULL values in that column.'}]},

{id:'indexes',title:'Indexes — Clustered vs Non-Clustered',sub:'How indexes speed up queries at a cost',tags:['Most Asked'],
what:'Index = data structure (B-Tree) that speeds reads at cost of write overhead. Clustered = physically orders table rows. Non-clustered = separate structure pointing to rows.',
why:'Without index, every query is a full table scan O(n). Index gives O(log n).',
how:'Clustered index: only one per table (usually the PK). Determines physical storage order. Non-clustered: multiple allowed, points to heap rows via row locator.',
trap:'Over-indexing slows INSERT/UPDATE/DELETE (every write updates all indexes). Index only frequently queried + filtered columns.',
interview:'What is the difference between a clustered and non-clustered index?',
remember:'Clustered = table IS the index (1 per table). Non-clustered = separate lookup structure (many allowed).',
checks:[{q:'How many clustered indexes can a table have?',a:'Exactly one.'},{q:'When does an index hurt performance?',a:'On tables with heavy writes (INSERT/UPDATE/DELETE) because indexes must be maintained on each write.'},{q:'What structure do most database indexes use?',a:'B-Tree (balanced tree), giving O(log n) search.'}]},

{id:'acid',title:'ACID Transactions + Isolation Levels',sub:'Transaction guarantees and concurrency anomalies',tags:['Most Asked'],
what:'Atomicity=all-or-nothing. Consistency=rules preserved. Isolation=concurrent txns don\'t interfere. Durability=committed data survives crashes.',
why:'Without ACID, concurrent transactions corrupt data or leave the DB in inconsistent state.',
how:'Isolation levels (weakest → strongest): READ UNCOMMITTED → READ COMMITTED → REPEATABLE READ → SERIALIZABLE. Higher isolation = fewer anomalies, more locking, less concurrency.',
diagram:'Isolation Level     | Dirty Read | Non-Repeatable | Phantom\nREAD UNCOMMITTED    |    YES     |      YES       |   YES\nREAD COMMITTED      |    NO      |      YES       |   YES\nREPEATABLE READ     |    NO      |      NO        |   YES\nSERIALIZABLE        |    NO      |      NO        |   NO\n\nDirty read = reading uncommitted data from another txn\nNon-repeatable = same row read twice gives different values\nPhantom = same query returns different set of rows',
trap:'Consistency in ACID = DB constraint rules. NOT the same as "consistency" in CAP theorem (distributed replication). Completely different concepts.',
interview:'What is a dirty read? Which isolation level prevents it?',
remember:'READ COMMITTED prevents dirty reads. REPEATABLE READ prevents non-repeatable reads. SERIALIZABLE prevents all.',
checks:[{q:'What does ROLLBACK do?',a:'Undoes all changes in the current transaction, restoring the previous state.'},{q:'Which MySQL default isolation level is used?',a:'REPEATABLE READ.'},{q:'What is a phantom read?',a:'Running the same SELECT twice returns different rows because another transaction inserted/deleted rows in between.'}]},

{id:'subqueries',title:'Subqueries + Correlated Subqueries',sub:'Nested queries and when they get expensive',tags:['Often Asked'],
what:'Subquery = a SELECT inside another SQL statement. Correlated subquery = inner query references a column from the outer query.',
why:'Complex filtering based on aggregated or related data that can\'t be done in a single level.',
how:'Regular: inner runs once. Correlated: inner runs ONCE PER OUTER ROW — can be very slow on large tables.',
code:'-- Regular subquery: runs once\nSELECT * FROM emp\nWHERE salary > (SELECT AVG(salary) FROM emp);\n\n-- Correlated subquery: runs once per employee row\nSELECT e.name FROM emp e\nWHERE salary > (SELECT AVG(salary) FROM emp WHERE dept_id = e.dept_id);\n\n-- Often better rewritten as a JOIN:\nSELECT e.name FROM emp e\nJOIN (SELECT dept_id, AVG(salary) avg_s FROM emp GROUP BY dept_id) d\n  ON e.dept_id = d.dept_id\nWHERE e.salary > d.avg_s;',
trap:'Correlated subqueries are often a performance issue. They can usually be rewritten as a JOIN for better performance.',
interview:'What is the difference between a correlated and non-correlated subquery?',
remember:'Correlated = inner depends on outer → runs N times (N = outer rows). Expensive on large tables.',
checks:[{q:'Which is generally faster — correlated subquery or equivalent JOIN?',a:'JOIN — it processes data more efficiently without re-executing per row.'}]},

{id:'sql-patterns',title:'SQL Interview Query Patterns',sub:'Common patterns tested in assessments',tags:['OA Pattern'],
what:'Recurring SQL query patterns in assessments: duplicates, Nth highest value, running totals, window functions.',
why:'These patterns appear repeatedly across interviews and OA platforms.',
how:'',
code:'-- Find duplicates\nSELECT email, COUNT(*) FROM users GROUP BY email HAVING COUNT(*) > 1;\n\n-- Nth highest salary (N=2)\nSELECT DISTINCT salary FROM emp ORDER BY salary DESC LIMIT 1 OFFSET 1;\n\n-- Running total (window function)\nSELECT date, amount,\n  SUM(amount) OVER (ORDER BY date) AS running_total\nFROM transactions;\n\n-- Rank employees by salary per department\nSELECT name, dept_id, salary,\n  RANK() OVER (PARTITION BY dept_id ORDER BY salary DESC) AS rnk\nFROM employees;\n\n-- Delete duplicates keeping one\nDELETE FROM emp WHERE id NOT IN (\n  SELECT MIN(id) FROM emp GROUP BY email);',
trap:'RANK() = ties get same rank with gaps (1,1,3). DENSE_RANK() = ties same rank no gaps (1,1,2). ROW_NUMBER() = always sequential.',
interview:'Write a query to find the second highest salary.',
remember:'Window functions use OVER(). They compute per-row without collapsing like GROUP BY.',
checks:[{q:'What does PARTITION BY do in a window function?',a:'Divides rows into groups (like GROUP BY), but doesn\'t collapse them.'},{q:'Difference between DELETE and TRUNCATE?',a:'DELETE is DML (logged, can rollback, can use WHERE). TRUNCATE is DDL (faster, no WHERE, usually cannot rollback).'}]},
],

os:[
{id:'process-thread',title:'Process vs Thread + PCB',sub:'Isolation vs shared-memory concurrency',tags:['Most Asked'],
what:'Process = isolated program execution with its own address space. Thread = lightweight execution unit inside a process, sharing its memory.',
why:'Processes isolate failures. Threads enable cheaper concurrency within one program.',
how:'PCB stores: PID, state, program counter, registers, memory maps, open files, priority. Threads share: heap, code, data, file descriptors. Each thread has its own: stack, registers, PC.',
diagram:'Process\n├─ Code segment (shared)\n├─ Data segment (shared)\n├─ Heap (shared)\n├─ Thread 1: Stack + Registers + PC\n├─ Thread 2: Stack + Registers + PC\n└─ Thread 3: Stack + Registers + PC',
trap:'Threads are NOT independent — a crash in one thread (uncaught exception) can kill the entire process.',
interview:'What memory do threads share within a process?',
remember:'Process = isolated. Thread = shared heap, own stack. Context switch between threads is cheaper than between processes.',
checks:[{q:'What is the PCB?',a:'Process Control Block — OS data structure storing all info about a process (state, PC, registers, memory info).'},{q:'Which is cheaper — creating a thread or a process?',a:'Thread — no new address space needed.'},{q:'Do threads in the same process have separate stacks?',a:'Yes, each thread has its own private stack.'}]},

{id:'scheduling',title:'CPU Scheduling Algorithms',sub:'FCFS, SJF, Round Robin, Priority',tags:['Often Asked'],
what:'Algorithms deciding which process gets the CPU next.',
why:'Optimize CPU utilization, throughput, turnaround time, waiting time, and fairness.',
how:'FCFS: first arrived runs first. Non-preemptive. Simple. Convoy effect.\nSJF: shortest burst first. Optimal avg wait. Hard to know burst time.\nRound Robin: time quantum. Preemptive. Fair. High overhead for short quantum.\nPriority: highest priority first. Risk of starvation (low-priority starved).',
diagram:'FCFS: P1(24ms) → P2(3ms) → P3(3ms)  Avg wait: (0+24+27)/3 = 17ms  ← convoy effect\nRR(q=4): P1(4)→P2(3)→P3(3)→P1(4)...  Avg wait: lower, fairer',
trap:'FCFS convoy effect: one long process blocks all short ones, causing high average wait time.',
interview:'What is the disadvantage of FCFS scheduling?',
remember:'FCFS = simple, convoy effect. SJF = optimal avg wait. RR = fair, overhead. Priority = starvation risk.',
checks:[{q:'Which scheduling algorithm can cause starvation?',a:'Priority scheduling — low-priority processes may never run if high-priority ones keep arriving.'},{q:'What is aging in scheduling?',a:'Gradually increasing the priority of waiting processes to prevent starvation.'}]},

{id:'synchronization',title:'Mutex, Semaphore, Race Condition',sub:'Protecting shared resources from concurrent access',tags:['Most Asked','Trap'],
what:'Mutex = binary lock with ownership (only locker can unlock). Semaphore = counter-based signal (any thread can signal). Race condition = concurrent access to shared state without sync causes unpredictable results.',
why:'Without synchronization, multi-threaded programs produce incorrect results.',
how:'Mutex: P1 acquires lock → P2 blocks → P1 releases → P2 acquires. Counting semaphore: allows N threads simultaneously (useful for resource pools). Binary semaphore ≈ mutex but lacks ownership.',
example:'Race: Thread A reads x=5. Thread B reads x=5. Both do x++. Both write x=6. Expected: x=7.',
trap:'A mutex must be released by the same thread that acquired it. A semaphore can be signaled by a different thread than the one that waited.',
interview:'What is the difference between a mutex and a binary semaphore?',
remember:'Mutex = exclusive + ownership. Semaphore = counting + signaling (no ownership).',
checks:[{q:'Is count++ on a shared variable a race condition without synchronization?',a:'Yes — read-modify-write is a 3-step operation that can be interleaved.'},{q:'What is a critical section?',a:'Code region that accesses shared resources and must execute atomically.'}]},

{id:'deadlock',title:'Deadlock — 4 Conditions + Prevention',sub:'Circular resource waits and how to break them',tags:['Most Asked'],
what:'Deadlock = two or more processes permanently wait for each other\'s resources, making no progress.',
why:'Circular resource dependency with no external intervention to break the cycle.',
how:'4 necessary conditions (Coffman): 1. Mutual Exclusion (resource held exclusively). 2. Hold & Wait (hold one, wait for another). 3. No Preemption (can\'t force-take resources). 4. Circular Wait (A→B→C→A).\nPrevention: break any one. Most practical: Circular Wait → consistent lock ordering.\nAvoidance: Banker\'s algorithm (theoretical).\nDetection: resource allocation graph → abort/rollback.',
diagram:'P1 holds R1 → waits for R2\nP2 holds R2 → waits for R1\n→ Neither can proceed → Deadlock',
trap:'Starvation ≠ Deadlock. Starvation = indefinitely waiting but no cycle. Deadlock = mutual block forming a cycle.',
interview:'How do you prevent deadlock in code?',
remember:'Break circular wait: always acquire locks in the same order (e.g., always Lock A before Lock B).',
checks:[{q:'List the 4 Coffman conditions.',a:'1. Mutual Exclusion 2. Hold & Wait 3. No Preemption 4. Circular Wait. ALL 4 must hold for deadlock.'},{q:'Which condition is easiest to break in practice?',a:'Circular Wait — enforce consistent lock ordering in code.'}]},

{id:'paging',title:'Paging, Virtual Memory, Page Fault',sub:'How OS manages memory beyond physical RAM',tags:['Most Asked'],
what:'Paging = divide memory into fixed-size pages (physical = frames). Virtual memory = process sees more memory than physically available. Page fault = process accesses a page not in RAM.',
why:'Programs larger than RAM can run. Processes isolated in virtual address spaces. Efficient memory utilization.',
how:'Page table maps virtual page number → physical frame. On access: TLB check → page table check → if not in RAM → page fault → OS loads from disk (swap) → resumes. Too many faults → thrashing.',
diagram:'Virtual Address = [Page Number | Offset]\n        ↓ TLB (cache)\n        ↓ Page Table\nPhysical Address = [Frame Number | Offset]',
trap:'Thrashing = process spends more time in page fault handling than executing. Adding more processes worsens it, not more RAM alone.',
interview:'What causes thrashing and how is it detected?',
remember:'TLB = cache for page table entries (fast). Page fault = page not in RAM → OS loads from disk.',
checks:[{q:'What is internal fragmentation in paging?',a:'Wasted space inside a page when a process needs less than a full page (e.g., needs 100 bytes, gets 4096-byte page).'},{q:'What does a TLB miss cause?',a:'A full page table walk (2 memory accesses instead of 1), then TLB update.'}]},

{id:'page-replacement',title:'Page Replacement + Fragmentation',sub:'LRU, FIFO, OPT and memory waste types',tags:['Often Asked'],
what:'When a page fault occurs and RAM is full, the OS must evict a page. Algorithms choose which to evict.',
why:'Choosing the wrong page to evict causes immediate future faults — "thrashing" in the worst case.',
how:'OPT (Optimal): evict page used furthest in future. Best possible, not implementable.\nLRU: evict least recently used. Best practical algorithm.\nFIFO: evict oldest. Simple. Has Belady\'s anomaly (more frames → more faults).\n\nFragmentation: Internal = waste inside a block (paging). External = gaps between blocks too small to use (segmentation).',
trap:'FIFO suffers Belady\'s anomaly: adding MORE page frames can cause MORE page faults. LRU does not.',
interview:'What is Belady\'s anomaly? Which algorithm suffers from it?',
remember:'LRU = best practical. FIFO = Belady\'s anomaly. OPT = theoretical ideal.',
checks:[{q:'What is external fragmentation?',a:'Free memory exists but scattered in small gaps too small for new allocations.'},{q:'Which fragmentation type does paging introduce?',a:'Internal fragmentation (page may not be fully used).'}]},

{id:'context-switch',title:'Context Switch + Scheduling Concepts',sub:'How OS switches between processes/threads',tags:['Often Asked'],
what:'Context switch = OS saves the state of the current process and loads the state of the next process.',
why:'Enables CPU time-sharing — multiple processes appear to run simultaneously on one CPU.',
how:'On interrupt/time slice: kernel saves registers, PC, stack pointer, page table base to PCB. Loads next process\'s PCB. CPU resumes that process.',
trap:'Context switching has overhead — pure overhead where no useful work is done. Too many processes = too much switching = less work done (CPU thrashing).',
interview:'What information is saved during a context switch?',
remember:'Context switch = save state to PCB + load next PCB. Overhead is pure waste — minimize with appropriate time quantum.',
checks:[{q:'Which scheduling event triggers a context switch?',a:'Timer interrupt (preemptive), I/O request, process termination, or higher-priority process ready.'},{q:'Why is thread context switching cheaper than process context switching?',a:'Threads share address space, so no TLB flush needed (address space doesn\'t change).'}]},
],

cn:[
{id:'osi',title:'OSI Model — 7 Layers',sub:'Standardized network communication layers',tags:['Most Asked'],
what:'7-layer conceptual model for network protocols.',
why:'Standardizes network communication so different vendors\' systems can interoperate.',
how:'Layer 7 Application (HTTP,FTP,DNS). Layer 6 Presentation (TLS,encoding). Layer 5 Session (RPC). Layer 4 Transport (TCP,UDP,ports). Layer 3 Network (IP,routers). Layer 2 Data Link (MAC,Ethernet,switches). Layer 1 Physical (cables,bits).',
diagram:'7 Application  → HTTP, SMTP, FTP, DNS\n6 Presentation → TLS/SSL, encoding, compression\n5 Session      → Session management, RPC\n4 Transport    → TCP, UDP (ports, end-to-end)\n3 Network      → IP, ICMP (logical addr, routing)\n2 Data Link    → Ethernet, MAC, frames, switches\n1 Physical     → Cables, signals, bits, hubs',
trap:'TCP/IP model has 4 layers (Application, Transport, Internet, Network Access). Different from OSI\'s 7 — know both.',
interview:'At which OSI layer does a router operate?',
remember:'"All People Seem To Need Data Processing" → layers 7 to 1. Router = L3. Switch = L2. Hub = L1.',
checks:[{q:'At which layer does TCP operate?',a:'Layer 4 (Transport).'},{q:'At which layer does IP operate?',a:'Layer 3 (Network).'},{q:'Routers operate at which layer?',a:'Layer 3 — they route based on IP addresses.'}]},

{id:'tcp-udp',title:'TCP vs UDP',sub:'Reliable ordered delivery vs lightweight best-effort',tags:['Most Asked'],
what:'TCP = connection-oriented, reliable, ordered, flow-controlled. UDP = connectionless, unreliable, no ordering, low overhead.',
why:'Different applications need different reliability vs latency tradeoffs.',
how:'TCP: 3-way handshake → sequence numbers → ACKs → retransmission → flow + congestion control. Header 20+ bytes.\nUDP: No handshake. Send and forget. Header 8 bytes. Much lower latency.',
diagram:'Use TCP: HTTP, HTTPS, FTP, email, database connections\nUse UDP: DNS queries, video streaming, gaming, VoIP, DHCP',
trap:'UDP is NOT "broken TCP". It deliberately omits reliability for speed. "UDP is unreliable" means no delivery guarantee, not that it\'s buggy.',
interview:'Why does DNS use UDP instead of TCP?',
remember:'TCP = reliable, heavy (connection setup). UDP = fast, unreliable (no setup). DNS uses UDP for speed (small packets, acceptable retry).',
checks:[{q:'What does TCP\'s three-way handshake establish?',a:'Synchronized sequence numbers and confirms both sides can send and receive.'},{q:'Which is better for video streaming — TCP or UDP?',a:'UDP — late packets are less useful than timely packets; retransmission delay would be worse.'},{q:'What is head-of-line blocking in TCP?',a:'A lost packet blocks all subsequent packets in the stream from being delivered.'}]},

{id:'ip-mac-arp',title:'IP, MAC, ARP, DNS, DHCP',sub:'The addressing stack behind every network request',tags:['Most Asked'],
what:'IP = logical network address (routing). MAC = physical hardware address (LAN delivery). ARP = maps IP to MAC on LAN. DNS = resolves domain names to IPs. DHCP = auto-assigns IPs.',
why:'Different addressing needed at different network levels. Humans need names; routers need IPs; LAN hardware needs MACs.',
how:'ARP: "Who has IP 192.168.1.5?" → broadcast → "It\'s me, MAC 00:1A:2B:3C". DNS: browser → local cache → ISP resolver → root NS → .com NS → google NS → IP returned. DHCP: DISCOVER → OFFER → REQUEST → ACK (DORA).',
trap:'MAC addresses are Layer 2 — NOT forwarded between networks by routers. Routers strip the L2 frame and create a new one at each hop.',
interview:'Walk me through what happens when you type google.com in a browser.',
remember:'DNS = name→IP. ARP = IP→MAC. DHCP = auto IP. IP = routing. MAC = local delivery.',
checks:[{q:'Does a router forward MAC addresses between networks?',a:'No. Routers operate at Layer 3 (IP). Each router hop creates a new L2 frame with new source/destination MACs.'},{q:'What is a DHCP DISCOVER message?',a:'A broadcast sent by a new device asking "Is there a DHCP server that can give me an IP?"'}]},

{id:'http-https',title:'HTTP, HTTPS, Status Codes, REST',sub:'Web protocol fundamentals every developer needs',tags:['Most Asked'],
what:'HTTP = stateless application protocol (request/response). HTTPS = HTTP over TLS (encrypted, authenticated).',
why:'Standardized communication between clients and servers. TLS adds confidentiality, integrity, and server authentication.',
how:'TLS Handshake: ClientHello → ServerHello + Certificate → Verify cert via CA → Key exchange → Symmetric key derived → Encrypted channel.\nHTTP is stateless — each request independent. Sessions managed via cookies/tokens.',
diagram:'Status codes:\n2xx  Success:   200 OK, 201 Created, 204 No Content\n3xx  Redirect:  301 Permanent, 302 Temporary\n4xx  Client Err: 400 Bad Request, 401 Unauth,\n                 403 Forbidden, 404 Not Found\n5xx  Server Err: 500 Internal Error, 503 Unavailable',
trap:'401 = not authenticated (prove who you are). 403 = authenticated but no permission. Very commonly confused in interviews.',
interview:'What is the difference between 401 and 403?',
remember:'HTTPS = HTTP + TLS. 401 = who are you? 403 = I know who you are, still no. TLS ≠ fixes app bugs.',
checks:[{q:'What does idempotent mean for HTTP methods?',a:'Multiple identical requests have the same effect as one. GET, PUT, DELETE are idempotent. POST is not.'},{q:'Which HTTP method is NOT idempotent?',a:'POST — each POST creates a new resource.'}]},

{id:'tcp-handshake',title:'Three-Way Handshake + Flow/Congestion Control',sub:'TCP connection setup and rate control',tags:['Often Asked'],
what:'Three-way handshake establishes a TCP connection. Flow control limits sender based on receiver capacity. Congestion control limits sender based on network capacity.',
why:'Handshake synchronizes sequence numbers. Flow control prevents receiver buffer overflow. Congestion control prevents network collapse.',
how:'Handshake: SYN(seq=x) → SYN-ACK(seq=y,ack=x+1) → ACK(ack=y+1). Connection established.\nFlow control: receiver advertises window size. Sender cannot exceed it.\nCongestion control: TCP slow start → exponential growth → congestion avoidance (linear) → fast retransmit on loss.',
diagram:'Client          Server\n  |──SYN(seq=x)──>|\n  |<──SYN-ACK───-|\n  |──ACK─────────>|\n  [Connection open]',
trap:'Closing TCP connection requires a FOUR-way termination (FIN → FIN-ACK → FIN → ACK), not three-way.',
interview:'What is the difference between flow control and congestion control?',
remember:'Flow = receiver says slow down. Congestion = network says slow down. Handshake = 3 steps open, 4 steps close.',
checks:[{q:'What is TCP slow start?',a:'TCP starts with a small congestion window and doubles it each RTT until loss is detected — then switches to linear growth.'},{q:'What triggers a TCP retransmission?',a:'ACK timeout or receiving 3 duplicate ACKs (fast retransmit).'}]},

{id:'routing',title:'Routing, Switches, Routers, Firewalls',sub:'How packets travel across networks',tags:['Often Asked'],
what:'Router = L3 device, routes packets between IP networks using routing tables. Switch = L2 device, forwards Ethernet frames within a LAN using MAC table. Firewall = filters traffic based on rules.',
why:'Packets must traverse multiple networks. Each router makes a hop decision based on destination IP.',
how:'Routing table: destination network → next hop → interface. Static routes: manually configured. Dynamic: RIP (distance vector), OSPF (link state), BGP (path vector — between ISPs).',
trap:'Router ≠ Switch. Router = Layer 3 (IP, between networks). Switch = Layer 2 (MAC, within LAN). Hub = Layer 1 (just broadcasts to all ports — dumb).',
interview:'What is the difference between a router and a switch?',
remember:'Router = routes between networks (L3, IP). Switch = forwards within LAN (L2, MAC). Hub = dumb broadcast (L1).',
checks:[{q:'What does NAT do?',a:'Network Address Translation — maps multiple private IPs to one public IP, allowing many devices to share one internet connection.'},{q:'What protocol do routers between ISPs use?',a:'BGP (Border Gateway Protocol).'}]},
],

dsa:[
{id:'big-o',title:'Big-O Complexity — Time and Space',sub:'How to measure and communicate algorithm efficiency',tags:['Foundation'],
what:'Big-O = upper bound on growth rate of time or space as input size n grows. Describes worst-case.',
why:'Interviewers expect you to state complexity for every solution you give.',
how:'O(1)=constant. O(log n)=binary search. O(n)=linear scan. O(n log n)=merge sort. O(n²)=nested loops. O(2ⁿ)=backtracking.',
diagram:'Faster → Slower:\nO(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(2ⁿ)\n\nHashMap get/put:     O(1) avg\nBinary search:       O(log n)\nMerge sort:          O(n log n)\nNested loop (brute): O(n²)',
trap:'Drop constants and lower-order terms: O(2n) = O(n). O(n² + n) = O(n²). Always simplify.',
interview:'What is the time complexity of your solution and can you optimize it?',
remember:'State time AND space. Always ask: "Can I do better than O(n²)?" Answer: usually yes, with a hash map.',
checks:[{q:'What is the time complexity of HashMap lookup?',a:'O(1) average. O(n) worst case (all keys collide to same bucket).'},{q:'Merge sort: time and space?',a:'O(n log n) time, O(n) space (auxiliary array).'}]},

{id:'arrays-strings',title:'Arrays and Strings — Core Patterns',sub:'Most common OA problem types',tags:['OA Core'],
what:'Array = contiguous memory, O(1) random access. String = immutable character sequence in Java.',
why:'Most OA problems are array/string manipulation. These patterns appear in 80% of online assessments.',
how:'Common patterns: prefix sum for range queries, two pointers for sorted arrays, frequency map for duplicates/anagrams, sliding window for substring problems.',
code:'// Prefix sum for range sum queries\nint[] prefix = new int[n+1];\nfor(int i=0;i<n;i++) prefix[i+1]=prefix[i]+nums[i];\n// Range sum [l,r] = prefix[r+1]-prefix[l]\n\n// Frequency map\nMap<Character,Integer> freq = new HashMap<>();\nfor(char c: s.toCharArray()) freq.merge(c,1,Integer::sum);\n\n// Check anagram: same frequency map',
trap:'String comparison: always use .equals(), never ==. String.charAt(i) vs char[] toCharArray() tradeoffs.',
interview:'How do you check if two strings are anagrams of each other?',
remember:'Prefix sum = build once, query O(1). Frequency map = counting anything. Sliding window = constraint over subarray.',
checks:[{q:'What is the time complexity of accessing element at index i in an array?',a:'O(1) — direct address computation.'},{q:'Why is string concatenation in a loop O(n²) in Java?',a:'Each + creates a new String object, copying all previous characters.'}]},

{id:'trees-graphs',title:'Trees, BST, BFS, DFS',sub:'Tree traversals and graph search patterns',tags:['OA Core'],
what:'Binary tree = each node has at most 2 children. BST = left < root < right. BFS = level-by-level (queue). DFS = depth-first (stack or recursion).',
why:'Trees appear in database indexes, file systems, decision trees. BFS finds shortest path. DFS finds paths, cycles, topological order.',
how:'BFS: enqueue root → while queue not empty: dequeue, process, enqueue children. Level-order traversal.\nDFS: preorder(root,left,right), inorder(left,root,right), postorder(left,right,root).\nBST search: O(log n) balanced, O(n) unbalanced.',
code:'// BFS template\nQueue<TreeNode> q = new LinkedList<>();\nq.offer(root);\nwhile(!q.isEmpty()){\n  int size = q.size();\n  for(int i=0;i<size;i++){\n    TreeNode n = q.poll();\n    // process n\n    if(n.left!=null) q.offer(n.left);\n    if(n.right!=null) q.offer(n.right);\n  }\n}',
trap:'BFS = SHORTEST path in UNWEIGHTED graph. For weighted graphs, use Dijkstra. DFS does NOT guarantee shortest path.',
interview:'When would you use BFS vs DFS?',
remember:'BFS = queue, shortest unweighted path. DFS = stack/recursion, path existence, cycle detection, topo sort.',
checks:[{q:'In-order traversal of a BST produces?',a:'A sorted sequence in ascending order.'},{q:'What data structure does iterative DFS use?',a:'Stack.'}]},
]
};

/* ─── CODING PATTERNS ─────────────────────────────────── */
const PATTERNS=[
{id:'two-sum',name:'Two Sum — HashMap Complement',cx:'O(n) time · O(n) space',
recognize:'Find two numbers summing to target. "Pair" problems.',
idea:'For each x, need is target-x. Store seen values in hashmap.',
trap:'Check before storing: if same index can\'t be reused, don\'t store then check.',
code:'Map<Integer,Integer> seen = new HashMap<>();\nfor(int i=0;i<nums.length;i++){\n  int need = target - nums[i];\n  if(seen.containsKey(need)) return new int[]{seen.get(need),i};\n  seen.put(nums[i],i);\n}',
problems:['Two Sum','Two Sum II (sorted)','4Sum']},

{id:'kadane',name:'Max Subarray — Kadane\'s',cx:'O(n) time · O(1) space',
recognize:'"Maximum sum contiguous subarray." Max profit variant.',
idea:'At each element: extend previous or start fresh. curr=max(x,curr+x).',
trap:'Initialize with nums[0] not 0 — handles all-negative arrays.',
code:'int curr=nums[0], max=nums[0];\nfor(int i=1;i<nums.length;i++){\n  curr=Math.max(nums[i],curr+nums[i]);\n  max=Math.max(max,curr);\n}',
problems:['Max Subarray','Best Time to Buy Sell (1 tx)']},

{id:'sliding-win',name:'Sliding Window — Variable Size',cx:'O(n) time · O(k) space',
recognize:'"Longest/shortest window satisfying constraint."',
idea:'Expand right, shrink left when constraint violated. Each element enters/leaves once.',
trap:'On duplicate: set left=max(left,lastSeen[c]+1) — not just +1.',
code:'Map<Character,Integer> seen=new HashMap<>();\nint left=0,ans=0;\nfor(int r=0;r<s.length();r++){\n  char c=s.charAt(r);\n  if(seen.containsKey(c)&&seen.get(c)>=left) left=seen.get(c)+1;\n  seen.put(c,r);\n  ans=Math.max(ans,r-left+1);\n}',
problems:['Longest Substring No Repeat','Minimum Window Substring','Fruit Into Baskets']},

{id:'prefix-sum',name:'Prefix Sum + HashMap',cx:'O(n) time · O(n) space',
recognize:'"Count subarrays summing to k." Range sum queries.',
idea:'If prefixSum[j]-prefixSum[i]==k then sum(i+1..j)==k. Store counts.',
trap:'Initialize map with {0:1} to handle subarrays starting at index 0.',
code:'Map<Integer,Integer> map=new HashMap<>();\nmap.put(0,1);\nint count=0,sum=0;\nfor(int x:nums){\n  sum+=x;\n  count+=map.getOrDefault(sum-k,0);\n  map.merge(sum,1,Integer::sum);\n}',
problems:['Subarray Sum Equals K','Continuous Subarray Sum','Binary Subarrays With Sum']},

{id:'two-ptr',name:'Two Pointers — Sorted Array',cx:'O(n) time · O(1) space',
recognize:'Sorted array, find pair/triplet. Remove duplicates. Merge arrays.',
idea:'Left at start, right at end (or both from start). Move based on comparison.',
trap:'For 3Sum: skip duplicates after fixing element AND while moving pointers.',
code:'// 3Sum template\nArrays.sort(nums);\nfor(int i=0;i<nums.length-2;i++){\n  if(i>0&&nums[i]==nums[i-1]) continue;\n  int l=i+1,r=nums.length-1;\n  while(l<r){\n    int s=nums[i]+nums[l]+nums[r];\n    if(s==0){result.add(Arrays.asList(nums[i],nums[l++],nums[r--]));}\n    else if(s<0) l++; else r--;\n  }\n}',
problems:['3Sum','3Sum Closest','Two Sum II','Container With Most Water']},

{id:'valid-paren',name:'Valid Parentheses — Stack',cx:'O(n) time · O(n) space',
recognize:'"Valid nesting." Matching brackets. Calculator expressions.',
idea:'Push openers. On closer, pop and check match. Stack empty at end.',
trap:'Check stack.isEmpty() before popping. Return stack.isEmpty() at end.',
code:'Deque<Character> stk=new ArrayDeque<>();\nfor(char c:s.toCharArray()){\n  if("([{".indexOf(c)>=0){stk.push(c);}\n  else{\n    if(stk.isEmpty()) return false;\n    char t=stk.pop();\n    if(c==\')\' &&t!=\'(\') return false;\n    if(c==\']\'&&t!=\'[\') return false;\n    if(c==\'}\' &&t!=\'{\') return false;\n  }\n}\nreturn stk.isEmpty();',
problems:['Valid Parentheses','Longest Valid Parentheses','Min Add to Make Valid']},

{id:'binary-search',name:'Binary Search Template',cx:'O(log n) time · O(1) space',
recognize:'Sorted array + find target. Minimize/maximize over monotonic condition.',
idea:'Cut search space in half. Maintain invariant: answer in [left,right].',
trap:'left+(right-left)/2 avoids integer overflow. Be careful with boundary: <=right vs <right.',
code:'int left=0,right=n-1;\nwhile(left<=right){\n  int mid=left+(right-left)/2;\n  if(nums[mid]==target) return mid;\n  else if(nums[mid]<target) left=mid+1;\n  else right=mid-1;\n}\nreturn -1; // not found',
problems:['Binary Search','Search in Rotated Sorted Array','Find Peak Element','Koko Eating Bananas']},

{id:'bfs-level',name:'BFS Level Order — Queue',cx:'O(n) time · O(w) space',
recognize:'"Level by level." Shortest path unweighted. Min depth.',
idea:'Queue-based. Process level size before processing children.',
trap:'Record level size BEFORE the loop — queue grows as you add children.',
code:'Queue<TreeNode> q=new LinkedList<>();\nq.offer(root);\nwhile(!q.isEmpty()){\n  int size=q.size();\n  for(int i=0;i<size;i++){\n    TreeNode node=q.poll();\n    // process node\n    if(node.left!=null) q.offer(node.left);\n    if(node.right!=null) q.offer(node.right);\n  }\n}',
problems:['Binary Tree Level Order','Minimum Depth of Tree','Right Side View','Word Ladder']},

{id:'fast-slow',name:'Fast & Slow Pointers',cx:'O(n) time · O(1) space',
recognize:'Detect cycle. Find middle of linked list. Happy number.',
idea:'Slow moves 1, fast moves 2. If cycle: they meet. For middle: when fast ends, slow is at mid.',
trap:'Cycle start: reset one pointer to head, advance both at speed 1 — they meet at cycle entry.',
code:'ListNode slow=head,fast=head;\nwhile(fast!=null&&fast.next!=null){\n  slow=slow.next;\n  fast=fast.next.next;\n  if(slow==fast) return true;\n}\nreturn false;',
problems:['Linked List Cycle','Find Cycle Start','Middle of Linked List','Happy Number']},

{id:'reverse-ll',name:'Reverse Linked List',cx:'O(n) time · O(1) space',
recognize:'"Reverse list or sublist." Palindrome linked list.',
idea:'Iteratively reverse next pointers. Track prev, curr, next.',
trap:'Save next BEFORE overwriting curr.next — otherwise you lose the rest of the list.',
code:'ListNode prev=null,curr=head;\nwhile(curr!=null){\n  ListNode next=curr.next;\n  curr.next=prev;\n  prev=curr;\n  curr=next;\n}\nreturn prev;',
problems:['Reverse Linked List','Reverse in K-Group','Palindrome Linked List']},

{id:'merge-sorted',name:'Merge Two Sorted Lists',cx:'O(m+n) time · O(1) space',
recognize:'"Merge sorted sequences." Merge K sorted lists (use heap).',
idea:'Dummy head. Compare front elements. Advance the smaller pointer.',
trap:'After loop: attach remaining non-null list. Don\'t forget the tail.',
code:'ListNode dummy=new ListNode(0),cur=dummy;\nwhile(l1!=null&&l2!=null){\n  if(l1.val<=l2.val){cur.next=l1;l1=l1.next;}\n  else{cur.next=l2;l2=l2.next;}\n  cur=cur.next;\n}\ncur.next=(l1!=null)?l1:l2;\nreturn dummy.next;',
problems:['Merge Two Sorted Lists','Merge K Sorted Lists','Sort List']},

{q:'Can you override a static method in Java?',

{q:'What does volatile do and when is it NOT enough?',

{q:'What is autoboxing and when does it cause bugs?',

{q:'Explain the difference between final, finally, finalize.',

{q:'What is the difference between Comparable and Comparator?',
